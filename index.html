<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#493323">
<title>Dice Chess</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dice Chess">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* Dice Chess — Soft Cocoa. Terang & lembut, putih bersih, dark cocoa sebagai identitas, caramel hanya aksen. Font: Inter. */
:root {
  color-scheme:only light;
  --bg:#F7F4EF; --surface:#FFFFFF; --cocoa:#493323; --cocoa-hover:#604632; --caramel:#A98261; --sand:#E9DED1; --warm:#8A8178; --tint:#FBF8F4;
  --ok:#2F7D4F; --ok-bg:#E4F1E8; --danger:#B3422F; --danger-bg:#F8E6E2;
  --sq-light:#F4EEE5; --sq-dark:#B99A7C;
  --r:12px; --r-lg:18px;
  --shadow:0 1px 2px rgba(73,51,35,.04), 0 6px 20px rgba(73,51,35,.05);
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body { margin:0; min-height:100vh; background:var(--bg); color:var(--cocoa);
  font:400 15px/1.55 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
h1,h2,h3 { margin:0 0 10px; line-height:1.25; letter-spacing:-.02em; color:var(--cocoa); font-weight:600; }
h1 { font-size:1.55rem; } h2 { font-size:1.25rem; } h3 { font-size:1rem; }
p { margin:0; }
a { color:var(--cocoa); }
code { background:var(--sand); padding:1px 6px; border-radius:6px; font-size:.88em; }
.shell, main { max-width:48rem; margin:0 auto; padding-left:1.25rem; padding-right:1.25rem; }
main { padding-bottom:4rem; }
body.playing .shell, body.playing main { max-width:64rem; }
@media (max-width:520px) { .shell, main { padding-left:.85rem; padding-right:.85rem; } h1 { font-size:1.4rem; } }

/* ---- Header ---- */
#nav { background:var(--cocoa); color:var(--bg); padding:.55rem 0; margin-bottom:1.25rem; }
body.playing #nav { margin-bottom:.6rem; padding:.3rem 0; }
.site-header { display:flex; align-items:center; justify-content:space-between; gap:1rem; }
.header-left { position:relative; min-width:0; }
.profile-btn { display:flex; align-items:center; gap:.7rem; padding:4px 14px 4px 4px; min-height:48px; background:transparent; color:var(--bg);
  border:0; border-radius:999px; text-align:left; max-width:100%; }
.profile-btn:hover:not(:disabled), .profile-btn[aria-expanded=true] { background:rgba(255,255,255,.1); }
.profile-btn .avatar { width:40px; height:40px; border:2px solid rgba(255,255,255,.28); }
.profile-text { display:flex; flex-direction:column; min-width:0; line-height:1.25; }
.profile-text b { font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.profile-text small { display:flex; align-items:center; gap:5px; font-size:.8rem; color:#D8C9B8; }
.profile-text small .ico { width:14px; height:14px; }
.header-right { display:flex; align-items:center; gap:8px; }
.conn { display:inline-flex; align-items:center; gap:8px; min-height:36px; padding:6px 14px; border-radius:999px; background:rgba(255,255,255,.1); color:var(--bg); font-size:.82rem; font-weight:500; }
.conn::before { content:""; width:8px; height:8px; border-radius:50%; background:#6FC38A; }
.conn.bad::before { background:#E58A7A; } .conn.connecting::before { background:var(--caramel); }
.install-btn { width:44px; padding:0; background:rgba(255,255,255,.1); color:var(--bg); border:0; border-radius:999px; }
.install-btn:hover:not(:disabled) { background:rgba(255,255,255,.2); }
.install-btn .lbl { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
.ico { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
@media (max-width:420px) { .conn { font-size:0; gap:0; padding:0; width:36px; justify-content:center; } }
.profile-card { position:absolute; z-index:1000; left:0; top:calc(100% + 10px); width:min(360px, calc(100vw - 1.7rem));
  max-height:calc(100vh - 110px); overflow-y:auto; overscroll-behavior:contain; padding:1.1rem; background:var(--surface); color:var(--cocoa);
  border:1px solid var(--sand); border-radius:var(--r-lg); box-shadow:0 16px 40px rgba(73,51,35,.16); display:flex; flex-direction:column; gap:.9rem; }

/* ---- Bagian halaman ---- */
.sec { margin-top:1.5rem; } .sec:first-child { margin-top:0; }
.title-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:.7rem; padding:0 .25rem; }
.title-row h2 { display:flex; align-items:center; gap:10px; margin:0; font-size:1.15rem; }
.title-row h2 .ico { width:22px; height:22px; color:var(--caramel); }
.card, .panel { background:var(--surface); border:1px solid var(--sand); border-radius:var(--r-lg); box-shadow:var(--shadow); }
.card { padding:1.25rem; }
.panel { overflow:hidden; }
.card:not(.stack) > * + * { margin-top:.75rem; }
.card:not(.stack) > h2 + *, .card:not(.stack) > h3 + * { margin-top:.5rem; }
.grid { display:grid; gap:1rem; grid-template-columns:repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.stack { display:flex; flex-direction:column; gap:1.1rem; }
.card.stack { gap:1rem; }
.row { display:flex; flex-wrap:wrap; align-items:center; gap:.7rem; }
.between { justify-content:space-between; }
.muted { color:var(--warm); font-size:.85rem; }
.center { text-align:center; padding:56px 12px; color:var(--warm); font-size:.9rem; }
.spinner { width:22px; height:22px; margin:0 auto 10px; border-radius:50%; border:2px solid var(--sand); border-top-color:var(--cocoa); animation:spin .7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.errbox { border-left:3px solid var(--danger); }

/* ---- Kontrol ---- */
button, .button, select, input { font:inherit; font-size:.875rem; min-height:44px; border-radius:var(--r); padding:8px 18px; }
:where(button, .button) { background:var(--cocoa); color:#fff; border:1px solid var(--cocoa); font-weight:600; cursor:pointer; text-decoration:none;
  display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:background .15s, border-color .15s, box-shadow .15s; }
:where(button, .button):hover:not(:disabled) { background:var(--cocoa-hover); border-color:var(--cocoa-hover); }
:where(button, .button):active:not(:disabled) { transform:translateY(1px); }
button.ghost, .button.ghost { background:var(--surface); color:var(--cocoa); border-color:var(--sand); }
button.ghost:hover:not(:disabled), .button.ghost:hover { background:var(--bg); border-color:var(--caramel); }
button.danger { background:var(--surface); color:var(--danger); border-color:#E7C5BE; }
button.danger:hover:not(:disabled) { background:var(--danger-bg); border-color:var(--danger); }
button:disabled { opacity:.45; cursor:not-allowed; }
:focus-visible { outline:2px solid var(--caramel); outline-offset:2px; }
select, input { background:var(--surface); color:var(--cocoa); border:1px solid var(--sand); max-width:100%; }
select:hover, input:hover { border-color:var(--caramel); }
select:focus, input:focus { outline:none; border-color:var(--cocoa); box-shadow:0 0 0 3px rgba(169,130,97,.28); }
input[type=checkbox] { min-height:0; width:20px; height:20px; padding:0; accent-color:var(--cocoa); }
input[type=file] { padding:8px; font-size:.8rem; }
label { display:flex; flex-direction:column; gap:6px; font-size:.78rem; font-weight:500; color:var(--warm); }
button.link { background:none; border:0; padding:6px 4px; min-height:36px; color:var(--cocoa); font-weight:600; font-size:.85rem; }
button.link:hover:not(:disabled) { background:none; color:var(--caramel); }
.big { width:100%; min-height:54px; font-size:1rem; }
.avatar { width:44px; height:44px; flex:none; border-radius:50%; background:var(--bg); color:var(--cocoa); border:1px solid var(--sand);
  display:inline-grid; place-items:center; font-size:22px; object-fit:cover; }
.presets button { width:44px; padding:0; font-size:20px; }
.presets button[aria-pressed=true] { background:var(--cocoa); color:#fff; border-color:var(--cocoa); }
.dot { display:inline-block; width:8px; height:8px; margin-right:6px; border-radius:50%; background:#BDB5AC; vertical-align:middle; }
.dot.on { background:#3FA66B; }
.note { text-align:center; color:var(--warm); font-size:.88rem; }

/* ---- Statistik + tabel ---- */
dl.stats { display:grid; grid-template-columns:1fr auto; margin:12px 0 0; }
dl.stats dt, dl.stats dd { padding:9px 0; border-bottom:1px solid var(--sand); margin:0; }
dl.stats dt { color:var(--warm); font-size:.875rem; }
dl.stats dd { padding-left:12px; text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
dl.stats dt:nth-last-of-type(1), dl.stats dd:last-of-type { border-bottom:0; }
.table { overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-size:.875rem; }
th { text-align:left; padding:10px 8px; font-size:.78rem; color:var(--warm); font-weight:600; border-bottom:1px solid var(--sand); white-space:nowrap; }
td { padding:10px 8px; border-bottom:1px solid var(--sand); }
ul { padding-left:1.2rem; margin:0; } li { margin:6px 0; font-size:.9rem; }
.dice-line { letter-spacing:.2em; font-size:1.05rem; }

/* ---- Head to head ---- */
.cmp-scroll { overflow-x:auto; }
table.cmp { table-layout:fixed; font-size:.9rem; }
.cmp col.first, .cmp th:first-child { width:44%; }
.cmp th { padding:14px 16px; font-size:.85rem; border-bottom:1px solid var(--sand); }
.cmp th, .cmp td { text-align:left; }
.cmp th.num, .cmp td.num { text-align:center; }
.cmp th.num { color:var(--cocoa); }
.cmp-player { display:inline-flex; align-items:center; gap:8px; max-width:100%; }
.cmp-player span:last-child { overflow:hidden; text-overflow:ellipsis; }
.cmp-player .avatar { width:28px; height:28px; font-size:15px; }
.cmp td { padding:13px 16px; border-bottom:0; }
.cmp tbody tr:nth-child(even) { background:var(--tint); }
.cmp tbody tr:hover { background:var(--bg); }
.cmp td.num { font-variant-numeric:tabular-nums; font-weight:600; }
.cmp td.shared { color:var(--warm); font-weight:500; }
.cmp-label { display:inline-flex; align-items:center; gap:12px; }
.cmp-label .ico { color:var(--caramel); }
.cmp .best { display:inline-block; font-weight:700; background:var(--sand); border-radius:999px; padding:1px 14px; }
@media (max-width:520px) { .cmp th, .cmp td { padding:12px 10px; font-size:.84rem; } .cmp th:first-child { width:42%; } .cmp-player { flex-direction:column; gap:2px; font-size:.7rem; } .cmp-label { gap:8px; } }

/* ---- Game history: baris belang seperti Head to head ---- */
.hist-body { padding:1rem 0; display:flex; flex-direction:column; gap:.75rem; }
.hist-body .filters { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; padding:0 1rem; }
.hist-body .filters > label { min-width:0; } .hist-body .filters select { width:100%; padding-left:10px; padding-right:6px; }
.hist-body > .row.between { flex-wrap:nowrap; gap:8px; padding:0 1rem; }
.hlist { display:flex; flex-direction:column; border-top:1px solid var(--sand); border-bottom:1px solid var(--sand); }
.hrow { display:flex; align-items:center; gap:12px; padding:8px 16px; min-height:64px; background:var(--surface); }
.hrow:nth-child(even) { background:var(--tint); }
.hrow:hover { background:var(--bg); }
.hmain { flex:1; min-width:0; display:flex; align-items:center; gap:12px; color:inherit; text-decoration:none; align-self:stretch; }
.hmain .avatar { width:40px; height:40px; }
.htext { display:flex; flex-direction:column; min-width:0; line-height:1.3; }
.htext b { font-weight:600; font-size:.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.htext small { font-size:.75rem; color:var(--warm); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mark { width:30px; height:30px; flex:none; border-radius:9px; display:grid; place-items:center; font-weight:700; font-size:.95rem; line-height:1; }
.mark.win { background:var(--ok-bg); color:var(--ok); } .mark.loss { background:var(--danger-bg); color:var(--danger); }
.mark.draw { background:var(--sand); color:var(--cocoa); } .mark.none { background:var(--bg); color:var(--warm); }
.button.replay { width:44px; min-height:44px; padding:0; border-radius:var(--r); }
.button.replay .ico { width:18px; height:18px; }
@media (max-width:520px) { .hmoves { display:none; } .hrow { gap:8px; padding:8px 12px; } .hmain { gap:8px; } .hmain .avatar { width:36px; height:36px; }
  .htext small { white-space:normal; } .hist-body > .row.between button { padding:8px 10px; font-size:.8rem; } .hist-body > .row.between span { white-space:nowrap; font-size:.75rem; } }

/* ---- Match setup ---- */
.versus-row { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:14px; }
.versus-row .row { flex-wrap:nowrap; min-width:0; }
.versus-row .row > div { min-width:0; } .versus-row strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.versus-row .avatar { width:52px; height:52px; font-size:26px; }
.vs { width:36px; height:36px; border-radius:50%; display:grid; place-items:center; background:var(--bg); border:1px solid var(--sand); color:var(--warm); font-weight:600; font-size:.75rem; }
@media (max-width:520px) { .versus-row { gap:8px; } .versus-row .avatar { width:40px; height:40px; font-size:20px; }
  .versus-row .row { flex-direction:column; text-align:center; gap:4px; } .versus-row .row > div { width:100%; } .versus-row strong { font-size:.85rem; } }
.field-label { font-size:.78rem; font-weight:500; color:var(--warm); }
.colorseg { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:6px; }
.colorbtn { flex-direction:column; gap:2px; min-height:78px; padding:8px 4px; }
.colorbtn small { font-size:.75rem; font-weight:500; color:var(--warm); }
.colorbtn[aria-checked=true] { border-color:var(--cocoa); box-shadow:0 0 0 2px var(--cocoa); background:var(--surface); }
.colorbtn[aria-checked=true] small { color:var(--cocoa); }
.knight { font:2.1rem/1 "Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif; -webkit-text-stroke:1.2px var(--cocoa); color:#fff; }
.knight.k-b { color:var(--cocoa); }
.knight.k-random { color:transparent; background:linear-gradient(90deg,#fff 50%,var(--cocoa) 50%); -webkit-background-clip:text; background-clip:text; }

/* ---- Papan ---- */
.match { display:grid; gap:1.5rem; grid-template-columns:minmax(0,1fr); }
@media (min-width:900px) { .match { grid-template-columns:minmax(0,540px) minmax(0,1fr); align-items:start; } }
.board { display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); grid-template-rows:repeat(8,minmax(0,1fr));
  width:100%; max-width:540px; margin:12px auto; aspect-ratio:1; border:5px solid var(--cocoa); border-radius:var(--r);
  overflow:hidden; container-type:inline-size; box-shadow:var(--shadow); contain:layout paint; }
.board button, .board button:hover:not(:disabled) { position:relative; min-height:0; min-width:0; padding:0; border:0; border-radius:0; background:var(--sq-light); color:var(--cocoa);
  display:grid; place-items:center; font:9.5cqw/1 "Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif; cursor:default; transition:none;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; }
.board button.dark, .board button.dark:hover:not(:disabled) { background:var(--sq-dark); }
.board button.can { cursor:pointer; }
.board button > span:not(.coord) { position:relative; z-index:1; }
.board button.last { box-shadow:inset 0 0 0 100px rgba(214,176,120,.42); }
.board button.selected { box-shadow:inset 0 0 0 3px var(--cocoa), inset 0 0 0 100px rgba(169,130,97,.5); }
.board button.movable::before { content:""; position:absolute; inset:0; background:radial-gradient(circle closest-side, transparent 114%, rgba(96,170,116,.9) 116%); }
.board button.movable.selected::before { background:rgba(96,170,116,.7); }
.board button.target::after { content:""; position:absolute; z-index:2; width:28%; height:28%; border-radius:50%; background:rgba(47,125,79,.78); }
.board button.target.occupied::after { width:88%; height:88%; background:none; border:3px solid rgba(47,125,79,.85); }
.piece-w { color:#fff; -webkit-text-stroke:1.5px var(--cocoa); }
.piece-b { color:#2B1D13; }
.coord { position:absolute; font:600 2.1cqw 'Inter',system-ui; color:var(--cocoa); opacity:.7; }
.coord.file { right:3px; bottom:1px; } .coord.rank { left:3px; top:1px; }

/* ---- Dadu (replay) ---- */
.die { width:64px; height:64px; border:1px solid var(--sand); border-radius:var(--r); background:var(--sq-light); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); }
.die b { font-size:2rem; font-weight:400; line-height:1; color:var(--cocoa); }
.die.used { opacity:.45; border-style:dashed; box-shadow:none; }
.die.rolling { animation:roll .5s ease-out; }
@keyframes roll { from { transform:rotate(-200deg) scale(.6); } to { transform:none; } }
[data-me] { cursor:pointer; }

/* ---- Auth / dialog / toast ---- */
.auth { max-width:420px; margin:40px auto; }
.auth h1 { text-align:center; margin-bottom:0; } .auth > .muted { text-align:center; }
.logo-mark { width:72px; height:72px; border-radius:18px; display:block; margin:0 auto; box-shadow:var(--shadow); }
dialog { border:1px solid var(--sand); border-radius:var(--r-lg); background:var(--surface); color:var(--cocoa);
  width:min(92vw,440px); padding:1.5rem; box-shadow:0 20px 50px rgba(73,51,35,.2); max-height:88vh; }
dialog p { color:var(--warm); margin-bottom:14px; }
dialog::backdrop { background:rgba(73,51,35,.4); }
#toast { position:fixed; left:16px; right:16px; bottom:16px; margin:auto; max-width:420px; z-index:2000; font-size:.9rem;
  background:var(--cocoa); color:var(--bg); border-radius:var(--r); padding:12px 16px; box-shadow:0 12px 32px rgba(73,51,35,.25); }
#toast:empty { display:none; }


/* ---- Wave (animasi gelombang lembut) ---- */
.wavy { position:relative; isolation:isolate; }
.wavy > *:not(.wave-clip) { position:relative; z-index:1; }
.wave-clip { position:absolute; inset:0; overflow:hidden; border-radius:inherit; pointer-events:none; z-index:0; }
.wave { position:absolute; left:0; bottom:0; width:200%; height:62%; color:var(--caramel); }
.wave g { transform-box:fill-box; transform-origin:0 0; }
.wave .w1 { animation:wv 16s linear infinite; } .wave .w2 { animation:wv 24s linear infinite reverse; } .wave .w3 { animation:wv 11s linear infinite; }
.wave .w1 path { fill-opacity:.2; } .wave .w2 path { fill-opacity:.12; } .wave .w3 path { stroke-opacity:.6; }
@keyframes wv { from { transform:translateX(0); } to { transform:translateX(-50%); } }
@media (prefers-reduced-motion:reduce) { .wave g { animation:none !important; } }
#nav { position:relative; isolation:isolate; }
#nav .shell { position:relative; z-index:1; }
#nav .wave { height:100%; color:#C9A27F; }
#nav .wave .w1 path { fill-opacity:.22; } #nav .wave .w2 path { fill-opacity:.14; } #nav .wave .w3 path { stroke-opacity:.55; }

/* ==== Area permainan ==== */
body.playing #secSetup > .title-row { display:none; }
.arena { --board:min(100%, 560px, max(300px, calc(100dvh - 430px))); display:flex; flex-direction:column; align-items:center; gap:10px; min-width:0; }
.match.arena-wrap { grid-template-columns:minmax(0,1fr); max-width:44rem; margin:0 auto; }
.arena .board { width:var(--board); max-width:none; margin:0; }
.seat { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:8px; width:100%; padding:8px; border-radius:var(--r-lg);
  background:var(--surface); border:1px solid var(--sand); }
.seat .who { display:flex; flex-direction:column; align-items:center; min-width:110px; line-height:1.25; }
.seat .who small, .side small { color:var(--warm); font-size:.75rem; }
.seat.bottom .who { min-height:142px; justify-content:flex-end; }   /* tinggi tetap: Roll tidak menggeser tata letak */
.side { display:flex; flex-direction:column; min-width:0; font-size:.9rem; padding-left:6px; }
.side strong { font-weight:600; }
.side.right { align-items:flex-end; padding:0 4px 0 0; }
.side.right button { padding:8px 14px; text-align:center; }
.pname { font-weight:600; max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pface { display:grid; place-items:center; width:72px; height:72px; margin-bottom:4px; border-radius:50%; border:2px solid var(--sand); }
.pface .avatar { width:62px; height:62px; font-size:32px; }
.pface.active { border-color:var(--caramel); box-shadow:0 0 0 3px rgba(169,130,97,.25); }
.seat.bottom .pface { width:96px; height:96px; } .seat.bottom .pface .avatar { width:84px; height:84px; font-size:44px; }
#setupBody button.rollbtn { width:96px; height:96px; min-height:0; margin-bottom:4px; padding:0; flex-direction:column; gap:0; border-radius:50%;

function patchNode(old, next) {
  if (old.nodeType !== next.nodeType || old.nodeName !== next.nodeName) return old.replaceWith(next);

    try { await fn(Object.fromEntries(new FormData(form))); }
    catch (err) { toast(friendly(err)); }
    finally { if (btn && btn.isConnected) btn.disabled = false; }
  };
}

// ---- Head to head: tabel perbandingan (gaya "Table Comparison" Tancredi Clan) ----
function headToHead(s) {
  const [a, b] = boot.players, A = s.players[a.id], B = s.players[b.id], h = s.headToHead, f = s.frequency;
  const num = v => Number(v).toLocaleString('id-ID');
  // [ikon, label, nilai A, nilai B, 'max' | null, format]
  const rows = [
    ['trophy', 'Menang', A.wins, B.wins, 'max', num],
    ['cross', 'Kalah', A.losses, B.losses, null, num],
    ['percent', 'Win rate', A.winRate, B.winRate, 'max', percent],
    ['equal', 'Remis', h.draws, h.draws, null, num],
    ...(h2hAll ? [
      ['flame', 'Streak menang terpanjang', A.longestStreak, B.longestStreak, 'max', num],
      ['flame', 'Streak menang saat ini', A.currentStreak, B.currentStreak, 'max', num],
    ] : []),
  ];
  const cell = (v, other, kind, fmt) =>
    `<td class="num">${kind === 'max' && Number(v) > Number(other) ? `<span class="best">${fmt(v)}</span>` : fmt(v)}</td>`;
  const shared = !h2hAll ? [] : [
    ['Total match selesai', h.total], ['Abandoned (tidak dihitung)', h.abandoned],
    ['Pemenang terakhir', h.mostRecentWinner ? name(h.mostRecentWinner) : '—'],
    ['Match 7 hari terakhir', f.last7days], ['Match 30 hari terakhir', f.last30days],
    ['Rata-rata durasi', duration(A.averageDuration)], ['Rata-rata langkah', Number(A.averageMoves).toFixed(1)],
    ['Total waktu bermain', duration(A.totalPlayingTime)], ['Terakhir bermain', date(A.lastPlayed)],
  ];
  const head = p => `<th class="num"><span class="cmp-player">${avatar(p.avatar)}<span>${esc(p.display_name)}</span></span></th>`;
  return `<div class="cmp-scroll"><table class="cmp">
    <thead><tr><th>Attribute</th>${head(a)}${head(b)}</tr></thead><tbody>
    ${rows.map(([k, label, va, vb, kind, fmt]) => `<tr><td><span class="cmp-label">${icon(k)}${label}</span></td>
      ${cell(va, vb, kind, fmt)}${cell(vb, va, kind, fmt)}</tr>`).join('')}
    ${shared.map(([label, v]) => `<tr><td>${label}</td><td class="num shared" colspan="2">${v}</td></tr>`).join('')}
    </tbody></table></div>`;
}

const shortDate = s => s ? new Date(s).toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
function historyRow(g) {
  const mine = g.player_white === boot.me ? 'w' : 'b';

  const outcome = g.status === 'abandoned' ? ['none', '–', 'Abandoned'] : !g.winner ? ['draw', '=', 'Remis']
    : g.winner === boot.me ? ['win', '+', 'Menang'] : ['loss', '−', 'Kalah'];

    <a class="hmain" href="#match/${g.id}" aria-label="Detail ${esc(g.game_code)}: lawan ${name(opp)}, ${outcome[2]}">
      ${avatar(player(opp)?.avatar)}

        <small>${shortDate(g.finished_at)} · ${duration(g.duration_seconds)} <span class="hmoves"> · ${g.total_moves ?? 0} langkah</span></small></span>

// ---- satu halaman berurutan: Match setup -> Head to head -> Players -> Game history ----

            `<button type="button" class="ghost colorbtn" role="radio" data-color="${v}" aria-checked="false" aria-label="${t}"><span class="knight k-${v}" aria-hidden="true">♞&#xFE0E;</span><small>${l}</small></button>`).join('')}</div>

    }

    } else {
      const myTurn = live.turn.player_id === boot.me, roll = live.roll;
      const needRoll = myTurn && !roll;
      // Lemparan yang langsung dilewati (tanpa gerakan) tetap diperlihatkan sampai lemparan berikutnya.
      const previous = live.rolls.at(-1);
      const passed = !roll && previous && !live.moves.some(m => m.turn_id === previous.turn_id) ? previous : null;
      const shown = roll || passed;
      if (shown && lastRollSeen !== shown.id) { lastRollSeen = shown.id; rollShownAt = Date.now(); }
      const animate = prefs.animation && shown && Date.now() - rollShownAt < 500;
      // Daftar gerakan legal dari database sudah memperhitungkan dadu yang belum terpakai.
      const legal = myTurn && roll ? live.legal : [];
      const targets = legal.filter(m => m.from === selected).map(m => m.to);
      const last = live.moves.at(-1);

      const tray = [0, 1, 2].map(i => {

      patchHtml(box, `<div class="match arena-wrap"><div class="arena">

            <small>${color(opponent)} · ${status(opponent)}</small></div>
          <div class="side right"></div></div>
        <div class="tray" role="group" aria-label="Hasil dadu" aria-live="polite">${tray}</div>
        ${passed ? `<p class="passnote">Tidak ada langkah legal, giliran ${name(passed.player_id)} dilewati.</p>` : ''}
        ${boardHtml(g.current_fen, { flip: flipFor(g.player_white), sel: selected, targets,
          movable: legal.map(m => m.from), last: last ? [last.from_square, last.to_square] : [] })}
        <div class="seat bottom wavy">${waveHtml()}
          <div class="side"><strong>${myTurn ? 'Giliranmu' : `Giliran ${name(live.turn.player_id)}`}</strong><small>${hint}</small></div>
          <div class="who">
            ${needRoll ? `<button type="button" class="rollbtn" data-act="roll" aria-label="Lempar tiga dadu">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9a8 8 0 0 1 13-3l2 2M20 4v4h-4M19 15a8 8 0 0 1-13 3l-2-2M4 20v-4h4"/></svg><span>ROLL</span></button>`
              : `<span>${face(boot.me, myTurn)}</span>`}
            <span class="pname">${name(boot.me)}</span><small>${color(boot.me)} · kamu</small></div>
          <div class="side right"><button type="button" class="danger" data-act="resign">Menyerah</button></div></div>
        </div>
        <div class="stack">
          ${offer ? `<div class="card"><p>${name(offer[1])} mengajukan ${offer[2]}.</p>${offer[1] === boot.me ? '' :
            `<div class="row"><button data-act="${offer[0]}">Setuju</button><button class="ghost" data-act="decline">Tolak</button></div>`}</div>` : ''}
        </div></div>`);
      if (last) {
        const key = `${g.id}:${last.from_square}${last.to_square}`;
        if (key !== lastAnimatedMove) { lastAnimatedMove = key; slide(last.from_square, last.to_square); }
      }
    }
}
function paintHistory(data) {

  const options = (list, current) => list.map(([v, l]) => `<option value="${v}" ${v === current ? 'selected' : ''}>${l}</option>`).join('');
  const rows = historyAll ? data.games : data.games.slice(0, 4);
  const more = $('#historyMore');
  more.hidden = data.games.length <= 4;
  more.textContent = historyAll ? 'Ringkas' : 'Lihat semua →';
  more.setAttribute('aria-expanded', String(historyAll));
  more.onclick = () => { historyAll = !historyAll; paintHistory(data); };
  box.innerHTML = `<div class="hist-body"><div class="filters">
    <label>Filter<select id="filter">${options([['all', 'Semua match'], ['p1', name(a.id) + ' menang'],
      ['p2', name(b.id) + ' menang'], ['draw', 'Remis'], ['abandoned', 'Abandoned']], historyQuery.filter)}</select></label>
    <label>Urutkan<select id="sort">${options([['newest', 'Terbaru'], ['oldest', 'Terlama dulu'],
      ['longest', 'Durasi terpanjang'], ['shortest', 'Durasi terpendek']], historyQuery.sort)}</select></label></div>
    ${rows.length ? `<div class="hlist">${rows.map(historyRow).join('')}</div>`
      : '<div class="card center">Belum ada pertandingan. Mulai satu dari Play.</div>'}
    <div class="row between"><button class="ghost" id="prev" ${data.page <= 1 ? 'disabled' : ''}>Sebelumnya</button>
    <span class="muted">Halaman ${data.page} / ${data.pages}</span>
    <button class="ghost" id="next" ${data.page >= data.pages || rows.length < data.games.length ? 'disabled' : ''}>Berikutnya</button></div></div>`;
  const go = change => { if (change.page > 1) historyAll = true; Object.assign(historyQuery, change); reloadHistory(); };
  $('#filter').onchange = e => go({ filter: e.target.value, page: 1 });
  $('#sort').onchange = e => go({ sort: e.target.value, page: 1 });
  $('#prev').onclick = () => go({ page: data.page - 1 });
  $('#next').onclick = () => go({ page: data.page + 1 });
}
// Hanya bagian riwayat yang dimuat ulang, jadi posisi scroll halaman tidak melompat.

  const box = $('#historyBody');

      const stop = () => clearInterval(replayTimer);
      const actions = {
        first: () => { stop(); at = 0; }, back: () => { stop(); at = Math.max(0, at - 1); },
        fwd: () => { stop(); at = Math.min(frames.length - 1, at + 1); },
        end: () => { stop(); at = frames.length - 1; }, pause: stop, restart: () => { stop(); at = 0; },
        play: () => { stop(); replayTimer = setInterval(() => { if (at >= frames.length - 1) return stop(); at++; draw(); }, 900); },
      };
      view.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { actions[b.dataset.r](); draw(); });
      draw();
    };
  },
};

// ---- game actions (every one carries the version we saw; the DB rejects stale/duplicate submits) ----
const ACTIONS = {
  accept: id => ['accept_match', { p_game_id: id }], cancel: id => ['cancel_match', { p_game_id: id }],
  roll: id => ['roll_dice', { p_game_id: id }], resign: id => ['resign_match', { p_game_id: id }],
  draw: id => ['offer_end', { p_game_id: id, p_kind: 'draw' }], abandon: id => ['offer_end', { p_game_id: id, p_kind: 'abandon' }],
  decline: id => ['decline_offer', { p_game_id: id }],
  endturn: id => ['end_turn', { p_game_id: id }],
};
async function gameAction(act) {
  if (!live || !ACTIONS[act]) return;
  const g = live.game;
  if (act === 'resign' && !await confirmBox('Menyerah?', 'Lawanmu akan dicatat sebagai pemenang.')) return;
  if (act === 'abandon' && !await confirmBox('Ajukan berhenti?', 'Pertandingan dihentikan tanpa hasil bila lawan setuju.')) return;
  if (act === 'cancel' && g.created_by !== boot.me && !await confirmBox('Tolak ajakan?', 'Pertandingan akan dibatalkan.')) return;
  if (act === 'endturn' && live.legal.length && !await confirmBox('Akhiri giliran?', 'Masih ada gerakan legal. Dadu yang tersisa akan hangus.')) return;
  const [fn, args] = ACTIONS[act](g.id);
  if (act === 'roll') {
    if (busy) return;
    beep();
    const button = $('.rollbtn');
    if (button) button.disabled = true;
    if (prefs.animation) $('.tray')?.classList.add('shaking');
  }
  await run(() => rpc(fn, { ...args, p_expected_version: g.version }));
  if (act === 'roll') paintSetup();   // pulihkan tombol bila lemparan gagal
}
function clickSquare(sq) {
  if (!live) return;
  if (live.pending) { pendingPick = sq; return; }     // diingat, diterapkan begitu jawaban server tiba
  if (busy) return;
  const options = live.legal.filter(m => m.from === selected && m.to === sq);
  if (!options.length) {
    const next = live.legal.some(m => m.from === sq) && selected !== sq ? sq : null;
    if (next === selected) return;
    selected = next;
    return paintSetup();
  }
  if (options.length === 1) return sendMove(options[0]);
  modal.innerHTML = `<h2>Promosi pion</h2><form method="dialog" class="row">${options.map(o =>
    `<button value="${o.uci}">${NAMES[o.promo]}</button>`).join('')}<button class="ghost" value="">Batal</button></form>`;
  modal.returnValue = '';
  modal.onclose = () => { const o = options.find(x => x.uci === modal.returnValue); if (o) sendMove(o); };
  modal.showModal();
}
// Hanya untuk tampilan sementara; keabsahan gerakan tetap diputuskan database.
function previewFen(fen, { from, to, promo }) {
  const [placement, ...rest] = fen.split(' ');
  const cells = placement.replace(/\d/g, n => '1'.repeat(+n)).replace(/\//g, '').split('');
  const at = q => (8 - +q[1]) * 8 + 'abcdefgh'.indexOf(q[0]);
  const a = at(from), b = at(to), piece = cells[a], white = piece === piece.toUpperCase();
  if (piece.toLowerCase() === 'p' && from[0] !== to[0] && cells[b] === '1') cells[b + (white ? 8 : -8)] = '1';   // en passant
  if (piece.toLowerCase() === 'k' && Math.abs(b - a) === 2) {                                                   // rokade
    const rookFrom = b > a ? a + 3 : a - 4, rookTo = (a + b) / 2;
    cells[rookTo] = cells[rookFrom]; cells[rookFrom] = '1';
  }
  cells[b] = promo ? (white ? promo.toUpperCase() : promo) : piece;
  cells[a] = '1';
  const rows = cells.join('').match(/.{8}/g).map(r => r.replace(/1+/g, m => m.length));
  return [rows.join('/'), ...rest].join(' ');
}
async function sendMove(move) {
  if (busy) return;
  const before = live, g = before.game;
  selected = null; pendingPick = null;
  live = { ...before, pending: true, legal: [], game: { ...g, current_fen: previewFen(g.current_fen, move) },
    moves: [...before.moves, { turn_id: null, from_square: move.from, to_square: move.to, die_indexes: [] }] };
  paintSetup();                                        // bidak langsung pindah
  beep();
  await run(() => rpc('make_move', { p_game_id: g.id, p_uci: move.uci, p_expected_version: g.version }),
    () => { live = before; lastAnimatedMove = ''; paintSetup(); });   // ditolak server: kembalikan
}

// Ketuk (atau Enter) pada profil sendiri membuka card edit profil.
function openOwnProfile(event) {
  if (!event.target.closest('[data-me]')) return;
  event.stopPropagation();
  window.scrollTo({ top: 0 });
  if ($('#profileCard').hidden) $('#profileBtn').click();
}
view.addEventListener('click', openOwnProfile);
view.addEventListener('keydown', e => { if (e.key === 'Enter') openOwnProfile(e); });

// Satu listener untuk semua tombol aksi (tidak pernah terpasang ganda).
view.addEventListener('click', event => {
  const button = event.target.closest('#setupBody [data-act]');
  if (button && !button.disabled) gameAction(button.dataset.act);
});
// Satu listener untuk seluruh papan. Tetap bekerja meskipun isi view dirender ulang.
view.addEventListener('click', event => {
  const square = event.target.closest('#setupBody .board button[data-sq]');
  if (!square || !view.contains(square)) return;
  event.preventDefault();
  clickSquare(square.dataset.sq);
});
// Serializes user actions: while one request is in flight, further clicks are ignored (no duplicate submits).
async function run(fn, rollback) {
  if (busy) return;
  busy = true;
  try { await fn(); }
  catch (e) { console.error(e); rollback?.(); toast(isStale(e) ? 'Status berubah, memuat ulang…' : friendly(e)); }
  try { await sync({ fresh: true }); }
  finally { busy = false; }
  if (live?.pending) { live = { ...live, pending: false }; paintSetup(); }
}


// ---- header: avatar profil (kiri) + tombol unduh app (kanan) ----
let deferredInstall = null;
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
window.addEventListener('appinstalled', () => { deferredInstall = null; updateInstallVisibility(); toast('Dice Chess terpasang di perangkatmu.'); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('[sw]', e)));
}
function updateInstallVisibility() { const b = $('#installBtn'); if (b) b.hidden = isStandalone(); }
async function installApp() {
  if (deferredInstall) {
    const p = deferredInstall; deferredInstall = null;
    p.prompt();
    try { await p.userChoice; } catch { /* ignored */ }
    return;
  }
  const steps = isIOS()
    ? 'Di Safari, ketuk tombol <strong>Bagikan</strong> (kotak dengan panah ke atas), lalu pilih <strong>Tambah ke Layar Utama</strong>.'
    : 'Buka menu browser (⋮), lalu pilih <strong>Instal aplikasi</strong> atau <strong>Tambahkan ke layar utama</strong>. Di komputer, klik ikon instal di bilah alamat.';
  modal.innerHTML = `<h2>Unduh Dice Chess</h2><p>${steps}</p>
    <p class="muted">Pasang hanya bisa dari alamat https (GitHub Pages), bukan dari file yang dibuka langsung.</p>
    <form method="dialog" class="row"><button>Mengerti</button></form>`;
  modal.onclose = null; modal.returnValue = '';
  modal.showModal();
}
function closeProfile() {
  const c = $('#profileCard'), b = $('#profileBtn');
  if (c) c.hidden = true;
  if (b) b.setAttribute('aria-expanded', 'false');
  document.body.classList.remove('modal-open');
}
function openProfile() {
  renderProfileCard();
  $('#profileCard').hidden = false;
  $('#profileBtn').setAttribute('aria-expanded', 'true');
  document.body.classList.add('modal-open');
  $('#profileCard input[name=displayName]')?.focus();
}
function renderProfileCard() {
  const me = player(boot.me);
  const card = $('#profileCard');
  card.innerHTML = `<form class="stack pf-box" id="pfForm" style="gap:1rem"><h3 style="margin:0">Edit profil</h3>
    <label>Nama tampilan<input name="displayName" maxlength="24" value="${esc(me.display_name)}" required></label>
    ${avatarPicker('avatar', cleanAvatar(me.avatar))}
    <div class="row"><button>Simpan profil</button><button type="button" class="ghost" id="pfCancel">Batal</button></div></form>`;
  $('#pfCancel').onclick = closeProfile;
  wirePickers(card);
  onSubmit($('#pfForm'), async d => {
    await rpc('update_profile', { p_display_name: d.displayName, p_avatar: d.avatar });
    await fetchPlayers(); updateHeader(); closeProfile(); toast('Profil disimpan.'); render();
  });
}
function buildHeader() {
  const nav = $('#nav');
  if (nav.dataset.built) return;
  nav.dataset.built = '1';
  nav.innerHTML = `${waveHtml()}<div class="shell"><div class="site-header">
    <div class="header-left"><button class="profile-btn" id="profileBtn" type="button" aria-haspopup="true" aria-expanded="false"
      aria-controls="profileCard" aria-label="Buka kartu profil"></button></div>
    <div class="header-right"><span class="conn connecting" id="conn" role="status">Menyambung</span>
    <button class="install-btn" id="installBtn" type="button" aria-label="Unduh app">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span class="lbl">Unduh app</span></button></div></div></div>`;
  if (!$('#profileCard')) {
    const o = document.createElement('div');
    o.id = 'profileCard'; o.className = 'profile-card'; o.hidden = true;
    o.setAttribute('role', 'dialog'); o.setAttribute('aria-modal', 'true'); o.setAttribute('aria-label', 'Edit profil');
    document.body.appendChild(o);
  }
  $('#profileBtn').onclick = e => { e.stopPropagation(); openProfile(); };
  $('#installBtn').onclick = installApp;
  updateInstallVisibility();
  paintConn();
}
function paintConn() {
  const el = $('#conn');
  if (!el) return;
  el.className = `conn ${connState}`;
  el.textContent = { ok: 'Online', bad: 'Offline', connecting: 'Menyambung' }[connState];
}
// "Champion" = pemain dengan kemenangan terbanyak (tidak ada bila seri).
function isChampion() {
  const mine = homeStats?.players?.[boot.me]?.wins ?? 0;
  return mine > 0 && boot.players.every(p => p.id === boot.me || mine > (homeStats.players[p.id]?.wins ?? 0));
}
function updateHeader() {
  const me = player(boot.me);
  if (!me) return;
  $('#profileBtn').innerHTML = `${avatar(me.avatar)}<span class="profile-text"><b>${esc(me.display_name)}</b><small>${isChampion() ? `${icon('crown')}Champion` : 'Dice Chess'}</small></span>`;
}

// ---- rendering ----
let renderId = 0;
async function render(showLoading = false) {
  if (!boot.me) return;
  const id = ++renderId;
  const [route, arg] = location.hash.slice(1).split('/');
  const page = (route === 'match' || route === 'replay') && arg ? 'match' : 'home';   // detail & replay = satu halaman
  buildHeader(); updateHeader();
  if (page !== 'home') document.body.classList.remove('playing');
  if (showLoading) loading();
  try {
    const paint = await pages[page](arg);
    if (id !== renderId) return;                // a newer render superseded this one
    clearInterval(replayTimer);
    paint();
  } catch (e) {
    console.error('[render]', e);
    if (id === renderId) errorBox(e, () => render(true));
  }
}
// Indikator koneksi dihapus dari header; status tetap dilacak dan hanya muncul sebagai pesan saat berubah.
function setConn(state) {
  const was = connState;
  connState = state;
  paintConn();
  if (state === 'bad' && was !== 'bad') toast('Koneksi terputus. Mencoba menyambung lagi…');
  if (state === 'ok' && was === 'bad') toast('Tersambung kembali.');
}

// ---- synchronisation: Realtime is only a "something changed" hint; get_live_state() is the truth ----
let inFlight = null, again = false, wanted = null;
function scheduleSync(delay = 60) { clearTimeout(syncTimer); syncTimer = setTimeout(() => sync(), delay); }
const behind = () => wanted && (!live || live.game.id !== wanted.id ? wanted.open : live.game.version < wanted.version);
// fresh = minta data yang lebih baru daripada permintaan yang sedang berjalan.
function sync({ fresh = false } = {}) {
  if (!boot.me) return Promise.resolve();
  if (inFlight) { if (fresh) again = true; return inFlight; }
  inFlight = (async () => {
    try {
      do {
        again = false;
        await applyState(await rpc('get_live_state'));
        lastSync = Date.now();
      } while (again || behind());
      wanted = null;
      if (connState !== 'ok' && channels.length) setConn('ok');
    } catch (e) { console.error('[sync]', e); wanted = null; setConn('bad'); toast(friendly(e)); }
    finally { inFlight = null; }
  })();
  return inFlight;
}
async function applyState(next) {
  // snapshot lama tidak boleh menimpa yang lebih baru (atau tampilan langkah yang sedang dikirim)
  if (next && live && next.game.id === live.game.id &&
      (next.game.version < live.game.version || (live.pending && next.game.version === live.game.version))) return;
  const changed = !!live?.pending || live?.game.id !== next?.game.id || live?.game.version !== next?.game.version;
  live = next;
  if (changed) {
    selected = pendingPick && live?.legal.some(m => m.from === pendingPick) ? pendingPick : null;
    pendingPick = null;
  }
  const onHome = isHome();
  if (live?.game.status === 'active') watching = live.game.id;
  else if (watching && !live) {
    const finished = watching; watching = null;
    if (onHome) { location.hash = 'match/' + finished; return; }
  }
  if (changed && onHome) paintSetup();
  if (changed && !onHome && live?.game.status === 'waiting' && live.game.created_by !== boot.me)
    toast('Ada ajakan bermain. Kembali ke halaman utama.');
}
// Realtime memberi tahu versi terbaru: lewati bila layar sudah memuatnya.
function onGameChange(payload) {
  realtimeProven = true;
  const row = payload?.new;
  if (row?.id == null) return scheduleSync();
  if (live && live.game.id === row.id && row.version <= live.game.version && !live.pending) return;
  wanted = { id: row.id, version: row.version, open: row.status !== 'completed' && row.status !== 'abandoned' };
  if (!busy && !inFlight) scheduleSync();             // saat busy, run() sendiri yang menyinkronkan
}

function teardownRealtime() {
  clearInterval(pollTimer); clearTimeout(syncTimer);
  channels.forEach(c => sb.removeChannel(c)); channels = [];
}
function setupRealtime() {
  teardownRealtime();
  const games = sb.channel('dice-chess-games')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'game_sessions' }, onGameChange)
    .subscribe(status => {
      if (status === 'SUBSCRIBED') { setConn('ok'); if (Date.now() - lastSync > 1500) scheduleSync(0); }       // (re)connected: refetch authoritative state
      else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') setConn('bad');
    });
  const presence = sb.channel('dice-chess-presence', { config: { presence: { key: boot.me } } });
  presence.on('presence', { event: 'sync' }, () => {
    const next = Object.keys(presence.presenceState()).sort();
    if (next.join() === [...online].sort().join()) return;
    online = next;
    if (isHome() && !busy) paintSetup();
  }).subscribe(async status => { if (status === 'SUBSCRIBED') await presence.track({ at: Date.now() }); });
  channels = [games, presence];
  // Safety net if a realtime message is ever missed.
  // Cadangan saja: diperpanjang bila Realtime terbukti mengirim, dan diam saat tab di belakang.
  pollTimer = setInterval(() => {
    if (document.hidden || busy) return;
    if (realtimeProven && connState === 'ok' && Date.now() - lastSync < 45000) return;
    sync();
  }, 15000);
}
window.addEventListener('online', () => { scheduleSync(0); });
window.addEventListener('offline', () => setConn('bad'));
document.addEventListener('visibilitychange', () => { if (document.hidden) clearInterval(replayTimer); else if (boot.me) scheduleSync(0); });
window.addEventListener('hashchange', () => {
  if (!boot.me) return;
  selected = null; $('#toast').textContent = ''; render(true); window.scrollTo(0, 0);
});

// ---- startup ----
function normalizeSupabaseUrl(raw) {
  let u;
  try { u = new URL(String(raw || '').trim()); }
  catch { throw new Error('SUPABASE_URL tidak valid. Isi dengan URL Project Supabase, contoh https://xxxx.supabase.co'); }
  if (u.protocol !== 'https:' && u.hostname !== 'localhost')
    throw new Error('SUPABASE_URL harus menggunakan HTTPS.');

  // URL project harus berupa root domain. Jika tanpa sengaja yang disalin
  // adalah ...supabase.co/rest/v1, Auth akan salah mengarah ke
  // /rest/v1/auth/v1/token (404). Bersihkan suffix API tersebut otomatis.
  u.pathname = u.pathname.replace(/\/(?:rest|auth|storage)\/v1(?:\/.*)?$/i, '');
  if (u.pathname && u.pathname !== '/')
    throw new Error('SUPABASE_URL harus URL utama project, bukan URL endpoint /rest/v1.');
  return u.origin;
}

async function start(route) {
  loading();
  try {
    if (!window.supabase) throw new Error('Library Supabase gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.');
    if (/YOUR-/.test(CONFIG.SUPABASE_URL + CONFIG.SUPABASE_KEY)) return configScreen();
    const projectUrl = normalizeSupabaseUrl(CONFIG.SUPABASE_URL);
    if (!CONFIG.SUPABASE_KEY || CONFIG.SUPABASE_KEY.startsWith('YOUR-'))
      throw new Error('SUPABASE_KEY belum diisi. Gunakan publishable key atau anon key, bukan service_role.');
    console.info('[Dice Chess] Supabase project:', projectUrl);
    sb ||= window.supabase.createClient(projectUrl, CONFIG.SUPABASE_KEY,
      { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
    const { data: { session }, error } = await sb.auth.getSession();
    if (error) throw error;
    if (!session) return loginScreen();
    const info = await rpc('get_session_info');
    if (!info.registered) return claimScreen(info);
    boot.me = session.user.id;
    const [, current] = await Promise.all([fetchPlayers(), rpc('get_live_state')]);
    $('#nav').hidden = false;
    if (route) history.replaceState(null, '', '#' + route);
    live = current; lastSync = Date.now();
    if (live?.game.status === 'active') watching = live.game.id;
    setupRealtime();
    await render(true);
  } catch (e) {
    console.error('[start]', e);
    errorBox(new Error(friendly(e)), () => start(route));
  }
}
start();
})();
</script>
