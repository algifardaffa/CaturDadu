<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#f1f5f9">
<title>Dice Chess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Dice Chess — mengikuti desain Tancredi Clan (mode terang saja)
   Netral = skala slate Tailwind, primer = indigo, font Inter, kartu rounded-2xl putih. */
:root {
  color-scheme: only light;
  --slate-50:#f8fafc; --slate-100:#f1f5f9; --slate-200:#e2e8f0; --slate-300:#cbd5e1; --slate-400:#94a3b8;
  --slate-500:#64748b; --slate-600:#475569; --slate-700:#334155; --slate-800:#1e293b; --slate-900:#0f172a;
  --indigo-50:#eef2ff; --indigo-100:#e0e7ff; --indigo-200:#c7d2fe; --indigo-300:#a5b4fc; --indigo-500:#6366f1;
  --indigo-600:#4f46e5; --indigo-700:#4338ca;
  --rose-600:#e11d48; --green-700:#15803d;
  --radius: 12px; --radius-lg: 16px;
  --shadow: 0 1px 3px rgba(15,23,42,.10), 0 4px 12px rgba(15,23,42,.05);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--slate-100); color: var(--slate-900);
  font: 400 16px/1.5 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
h1, h2, h3 { margin: 0 0 12px; line-height: 1.2; letter-spacing: -.01em; color: var(--slate-900); }
h1 { font-size: 1.5rem; font-weight: 800; } h2 { font-size: 1.125rem; font-weight: 700; } h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--indigo-600); }
code { background: var(--slate-100); padding: 1px 6px; border-radius: 6px; font-size: .88em; }
.shell { max-width: 80rem; margin: 0 auto; padding: 0 1rem; }
main { max-width: 80rem; margin: 0 auto; padding: 0 1rem 3rem; }
@media (min-width: 640px) { .shell, main { padding-left: 1.5rem; padding-right: 1.5rem; } }
@media (min-width: 1024px) { .shell, main { padding-left: 2rem; padding-right: 2rem; } }

/* ---- Header (brand kiri, aksi kanan) ---- */
#nav { padding-top: 2rem; margin-bottom: 1.5rem; }
#nav .shell { border-bottom: 1px solid var(--slate-200); padding-bottom: 1rem; }
.site-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.site-brand { display: flex; align-items: center; gap: .75rem; min-width: 0; text-decoration: none; color: inherit; }
.brand-mark { width: 44px; height: 44px; flex: none; border-radius: var(--radius); background: var(--indigo-600);
  color: #fff; display: grid; place-items: center; font-size: 26px; line-height: 1; box-shadow: var(--shadow); }
.brand-mark.big { width: 56px; height: 56px; font-size: 32px; margin: 0 auto; }
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-title { font-weight: 800; letter-spacing: -.01em; font-size: 1.05rem; line-height: 1.1; color: var(--slate-900); white-space: nowrap; }
.brand-sub { font-size: .8rem; font-weight: 500; color: var(--slate-500); white-space: nowrap; }
.header-actions { display: flex; align-items: center; gap: .5rem; position: relative; }
.conn { font-size: .75rem; font-weight: 600; color: var(--slate-600); display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap; padding: 6px 10px; border: 1px solid var(--slate-300); border-radius: var(--radius); background: #fff; }
.conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--slate-400); }
.conn.ok::before { background: #16a34a; } .conn.bad::before { background: var(--rose-600); }
@media (max-width: 420px) { .conn { font-size: 0; gap: 0; padding: 12px; } .brand-sub { display: none; } }
.icon-btn { min-width: 42px; min-height: 42px; padding: 0 10px; border: 1px solid var(--slate-300); background: #fff;
  color: var(--slate-600); border-radius: var(--radius); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
button.icon-btn:hover:not(:disabled) { background: var(--slate-100); color: var(--slate-900); }
.icon-btn[aria-expanded=true] { background: var(--slate-200); border-color: var(--slate-400); }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav-menu-panel { position: absolute; z-index: 1000; right: 0; top: calc(100% + 10px); width: min(260px, calc(100vw - 32px));
  padding: .5rem; border: 1px solid var(--slate-300); border-radius: var(--radius-lg); background: #fff;
  box-shadow: 0 16px 40px rgba(15,23,42,.2); display: flex; flex-direction: column; gap: .25rem; }
.nav-menu-item { display: flex; align-items: center; justify-content: flex-start; gap: .75rem; width: 100%; text-align: left; padding: .75rem; min-height: 44px;
  border-radius: .75rem; color: var(--slate-800); font-size: .875rem; font-weight: 600; background: transparent; border: 0;
  cursor: pointer; text-decoration: none; }
.nav-menu-item:hover:not(:disabled), .nav-menu-item:focus-visible { background: var(--slate-100); outline: none; }
.nav-menu-item.active, .nav-menu-item.active:hover:not(:disabled) { background: var(--indigo-50); color: var(--indigo-700); }
.menu-icon { width: 1.25rem; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.menu-icon .ico { width: 20px; height: 20px; }
.nav-menu-divider { height: 1px; background: var(--slate-200); margin: .25rem .5rem; }

/* tab pill (desktop) */
.site-nav { display: none; gap: .25rem; margin-top: 1rem; overflow-x: auto; }
@media (min-width: 720px) { .site-nav { display: flex; } }
.tab-btn { padding: .5rem .75rem; border-radius: .75rem; background: transparent; border: 1px solid transparent; color: var(--slate-600);
  font-size: .8rem; font-weight: 700; text-decoration: none; white-space: nowrap; transition: all .2s ease; min-height: 0; display: inline-flex; align-items: center; }
.tab-btn:hover { color: var(--slate-900); background: rgba(148,163,184,.2); }
.tab-btn.active { background: #fff; color: var(--slate-900); border-color: var(--slate-300); box-shadow: 0 4px 12px rgba(15,23,42,.10); }

/* ---- Surfaces ---- */
.card { background: #fff; border: 1px solid var(--slate-300); border-radius: var(--radius-lg); padding: 1.25rem; box-shadow: var(--shadow); }
/* jarak antar isi kartu */
.card:not(.stack) > * + * { margin-top: .75rem; }
.card:not(.stack) > h1 + *, .card:not(.stack) > h2 + *, .card:not(.stack) > h3 + * { margin-top: .5rem; }
a.card { transition: border-color .15s, box-shadow .15s; display: block; }
a.card:hover { border-color: var(--indigo-300); box-shadow: 0 1px 3px rgba(15,23,42,.1), 0 8px 20px rgba(79,70,229,.08); }
.grid { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.stack { display: flex; flex-direction: column; gap: 1.5rem; }
.card.stack { gap: 1rem; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; }
.between { justify-content: space-between; }
.muted { color: var(--slate-500); font-size: .875rem; }

/* ---- Controls ---- */
button, .button, select, input { font: inherit; font-size: .875rem; min-height: 44px; border-radius: var(--radius); padding: 8px 16px; }
button, .button { background: var(--indigo-600); color: #fff; border: 1px solid var(--indigo-500); font-weight: 600; cursor: pointer;
  text-decoration: none; display: inline-flex; align-items: center; justify-content: center; transition: background .15s, border-color .15s; }
button:hover:not(:disabled), .button:hover { background: var(--indigo-500); }
button.ghost, .button.ghost { background: #fff; color: var(--slate-700); border-color: var(--slate-300); }
button.ghost:hover:not(:disabled), .button.ghost:hover { background: var(--slate-100); color: var(--slate-900); }
button.danger { background: var(--rose-600); border-color: var(--rose-600); }
button:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--indigo-500); outline-offset: 2px; }
select, input { background: #fff; color: var(--slate-900); border: 1px solid var(--slate-300); max-width: 100%; transition: border-color .15s, box-shadow .15s; }
select:focus, input:focus { outline: none; border-color: var(--indigo-500); box-shadow: 0 0 0 2px rgba(99,102,241,.35); }
input::placeholder { color: var(--slate-500); }
input[type=checkbox] { min-height: 0; width: 20px; height: 20px; padding: 0; accent-color: var(--indigo-600); }
input[type=file] { padding: 8px; font-size: .8rem; }
label { display: flex; flex-direction: column; gap: 6px; font-size: .8rem; font-weight: 600; color: var(--slate-600); }
label.inline { flex-direction: row; align-items: center; gap: 10px; min-height: 44px; font-size: .9rem; color: var(--slate-800); }
.avatar { width: 44px; height: 44px; flex: none; border-radius: 50%; background: var(--indigo-50); color: var(--indigo-700);
  border: 1px solid var(--indigo-100); display: inline-grid; place-items: center; font-size: 22px; object-fit: cover; }
.presets button { width: 44px; padding: 0; font-size: 20px; }
.presets button[aria-pressed=true] { background: var(--indigo-600); color: #fff; border-color: var(--indigo-600); }

/* ---- Stats + tabel ---- */
dl.stats { display: grid; grid-template-columns: 1fr auto; gap: 0; margin: 12px 0 0; }
dl.stats dt, dl.stats dd { padding: 8px 0; border-bottom: 1px solid var(--slate-200); margin: 0; }
dl.stats dt { color: var(--slate-500); font-size: .875rem; }
dl.stats dd { padding-left: 12px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
dl.stats dt:nth-last-of-type(1), dl.stats dd:last-of-type { border-bottom: 0; }
.table { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .875rem; }
th { text-align: left; padding: 10px 8px; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--slate-500);
  font-weight: 700; border-bottom: 1px solid var(--slate-300); white-space: nowrap; }
td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--slate-200); }
tr:hover td { background: var(--slate-50); }
ul { padding-left: 1.2rem; margin: 0; } li { margin: 6px 0; color: var(--slate-700); font-size: .9rem; }

/* ---- Papan ---- */
.match { display: grid; gap: 1.5rem; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .match { grid-template-columns: minmax(0, 580px) minmax(0, 1fr); align-items: start; } }
.board { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(0, 1fr));
  width: 100%; max-width: 580px; margin: 12px auto; aspect-ratio: 1; border: 1px solid var(--slate-400);
  border-radius: var(--radius-lg); overflow: hidden; container-type: inline-size; box-shadow: var(--shadow); }
.board button { position: relative; min-height: 0; min-width: 0; padding: 0; border: 0; border-radius: 0;
  background: var(--slate-100); color: var(--slate-900); display: grid; place-items: center;
  font: 9.5cqw/1 "Segoe UI Symbol", "Noto Sans Symbols 2", "DejaVu Sans", serif; opacity: 1; cursor: default; }
.board button:hover:not(:disabled) { background: var(--slate-100); }
.board button.dark, .board button.dark:hover:not(:disabled) { background: var(--slate-300); }
.board button.can { cursor: pointer; }
.board button.last { box-shadow: inset 0 0 0 100px rgba(99,102,241,.20); }
.board button.selected { box-shadow: inset 0 0 0 3px var(--indigo-600), inset 0 0 0 100px rgba(99,102,241,.28); }
.board button.target::after { content: ""; position: absolute; width: 28%; height: 28%; border-radius: 50%; background: rgba(79,70,229,.75); }
.board button.target.occupied::after { width: 88%; height: 88%; background: none; border: 3px solid rgba(79,70,229,.85); }
.piece-w { color: #fff; -webkit-text-stroke: 1.5px var(--slate-900); }
.piece-b { color: var(--slate-900); }
.coord { position: absolute; font: 700 2.1cqw 'Inter', system-ui; color: var(--slate-600); }
.coord.file { right: 3px; bottom: 1px; } .coord.rank { left: 3px; top: 1px; }

/* ---- Dadu ---- */
.die { width: 64px; height: 64px; border: 1px solid var(--slate-300); border-radius: var(--radius); background: #fff;
  color: var(--slate-900); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; box-shadow: var(--shadow); }
.die b { font-size: 1.4rem; color: var(--indigo-700); } .die small { font-size: .7rem; color: var(--slate-500); font-weight: 600; }
.die.used { opacity: .45; border-style: dashed; box-shadow: none; }
.die.rolling { animation: roll .5s ease-out; }
@keyframes roll { from { transform: rotate(-200deg) scale(.6); } to { transform: none; } }
.turn { border-left: 4px solid var(--indigo-600); }

/* ---- Status / auth / dialog / toast ---- */
.center { text-align: center; padding: 48px 12px; color: var(--slate-500); font-size: .9rem; font-weight: 500; }
.spinner { width: 22px; height: 22px; margin: 0 auto 10px; border-radius: 50%; border: 2px solid rgba(148,163,184,.3);
  border-top-color: var(--slate-600); animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.errbox { border-left: 4px solid var(--rose-600); }
.auth { max-width: 420px; margin: 32px auto; }
.auth h1 { text-align: center; margin-bottom: 0; } .auth > .muted { text-align: center; }
dialog { border: 1px solid var(--slate-300); border-radius: var(--radius-lg); background: #fff; color: var(--slate-900);
  width: min(92vw, 420px); padding: 1.5rem; box-shadow: 0 16px 40px rgba(15,23,42,.25); }
dialog p { color: var(--slate-600); margin-bottom: 16px; }
dialog::backdrop { background: rgba(15,23,42,.45); }
#toast { position: fixed; left: 16px; right: 16px; bottom: 16px; margin: auto; max-width: 420px; z-index: 2000; font-size: .9rem; font-weight: 500;
  background: var(--slate-900); color: #fff; border-radius: var(--radius); padding: 12px 16px; box-shadow: 0 16px 40px rgba(15,23,42,.3); }
#toast:empty { display: none; }
@media (max-width: 520px) { #nav { padding-top: 1rem; } h1 { font-size: 1.3rem; } .die { width: 56px; height: 56px; } }
@media (prefers-reduced-motion: reduce) { .die.rolling, .spinner { animation: none; } }
</style>
</head>
<body>
<header id="nav" hidden></header>
<main id="view" aria-live="polite"><div class="center"><div class="spinner"></div>Memuat…</div></main>
<dialog id="modal"></dialog>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
'use strict';
/* =====================================================================
   DICE CHESS — single-file frontend (GitHub Pages) + Supabase backend
   1) Fill in the two values below (Supabase -> Project Settings -> API).
   2) Only the PUBLISHABLE / anon key goes here. NEVER the service_role key.
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://xnhwmvalyzrxcsdozcvk.supabase.co',
  SUPABASE_KEY: 'sb_publishable_-D1e-xsciwI9nWAO9l-rvA_aO0UeIIy',
};

(() => {
const $ = s => document.querySelector(s);
const view = $('#view'), modal = $('#modal');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const NAMES = { p: 'Pion', n: 'Kuda', b: 'Gajah', r: 'Benteng', q: 'Menteri', k: 'Raja' };
const GLYPH = { p: '♟', n: '♞', b: '♝', r: '♜', q: '♛', k: '♚' };
const DIE = ['', 'p', 'n', 'b', 'r', 'q', 'k'];
const PRESETS = ['♔', '♕', '♖', '♗', '♘', '♙', '★', '♥'];
const REASONS = { king_captured: 'Raja dimakan', resignation: 'Menyerah', agreement: 'Sepakat remis',
  turn_limit: '100 giliran tanpa kemajuan', bare_kings: 'Tinggal dua raja',
  mutual_abandon: 'Dihentikan bersama', cancelled: 'Dibatalkan' };
const NAV = [['dashboard', 'Dashboard'], ['play', 'Play'], ['players', 'Players'],
  ['history', 'Game History'], ['statistics', 'Statistics'], ['settings', 'Settings']];

// ---- state (module-private) ----
let sb = null;                       // Supabase client
let boot = { me: null, players: [] };// me = uuid of signed-in player
let live = null, online = [], selected = null, busy = false, replayTimer, lastRollSeen = null;
let watching = null;                 // id of the active game we are following (for the end-of-game summary)
let channels = [], pollTimer = null, syncTimer = null, connState = 'connecting';
const historyQuery = { filter: 'all', sort: 'newest', page: 1 };

const prefs = (() => {
  const base = { sound: true, animation: true, orientation: 'white' };
  try { return { ...base, ...JSON.parse(localStorage.getItem('dc-prefs')) }; } catch { return base; }
})();
const savePrefs = () => { try { localStorage.setItem('dc-prefs', JSON.stringify(prefs)); } catch { /* storage blocked */ } };

// ---- helpers ----
let toastTimer;
function toast(message) {
  $('#toast').textContent = message;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('#toast').textContent = ''; }, 4500);
}
function beep() {
  if (!prefs.sound) return;
  try {
    const ctx = beep.ctx ||= new AudioContext(), o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 420; g.gain.setValueAtTime(.08, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .15);
    o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + .15);
  } catch { /* audio unavailable */ }
}
const isStale = e => /sudah berubah/i.test(e?.message || '');
function friendly(error) {
  const msg = error?.message || String(error);
  if (/Failed to fetch|NetworkError|Load failed/i.test(msg)) return 'Tidak ada koneksi ke server. Periksa internet lalu coba lagi.';
  if (/JWT|expired|not authenticated/i.test(msg)) return 'Sesi berakhir. Silakan masuk lagi.';
  return msg;
}
// Every backend call goes through here: one place for error logging + readable messages.
async function rpc(name, args = {}) {
  const { data, error } = await sb.rpc(name, args);
  if (error) { console.error(`[rpc ${name}]`, error); throw new Error(friendly(error)); }
  return data;
}
async function fetchPlayers() {
  const { data, error } = await sb.from('players').select('*').order('slot');
  if (error) { console.error('[players]', error); throw new Error(friendly(error)); }
  boot.players = data;
}

const player = id => boot.players.find(p => p.id === id);
const name = id => esc(player(id)?.display_name);
const avatar = a => (a || '').startsWith('data:') ? `<img class="avatar" src="${esc(a)}" alt="">`
  : `<span class="avatar" aria-hidden="true">${esc(a)}</span>`;
const who = (id, extra = '') => `<div class="row">${avatar(player(id)?.avatar)}<div><strong>${name(id)}</strong>
  <div class="muted">${extra}</div></div></div>`;
const date = s => s ? new Date(s).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
const duration = s => { s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}j ${m}m` : m ? `${m}m ${s % 60}dtk` : `${s}dtk`; };
const percent = v => Math.round(Number(v) * 100) + '%';
const result = g => g.status === 'abandoned' ? 'Abandoned' : g.winner ? `${name(g.winner)} menang` : 'Remis';
const loading = (text = 'Memuat…') => { view.innerHTML = `<div class="center"><div class="spinner"></div>${esc(text)}</div>`; };
const errorBox = (e, retry) => {
  view.innerHTML = `<div class="card errbox stack"><h2>Terjadi masalah</h2><p>${esc(e.message)}</p>
    <div class="row"><button id="retry">Coba lagi</button></div></div>`;
  $('#retry').onclick = retry;
};

function confirmBox(title, text) {
  return new Promise(resolve => {
    modal.innerHTML = `<h2>${esc(title)}</h2><p>${esc(text)}</p><form method="dialog" class="row">
      <button value="yes">Ya, lanjutkan</button><button class="ghost" value="no">Batal</button></form>`;
    modal.returnValue = 'no';
    modal.onclose = () => resolve(modal.returnValue === 'yes');
    modal.showModal();
  });
}

// ---- board ----
function boardHtml(fen, { flip = false, last = [], sel = null, targets = [], movable = [] } = {}) {
  const squares = [];
  fen.split(' ')[0].split('/').forEach((row, r) => {
    let f = 0;
    for (const ch of row) {
      if (/\d/.test(ch)) for (let i = 0; i < +ch; i++) squares.push([f++, r, null]);
      else squares.push([f++, r, ch]);
    }
  });
  if (flip) squares.reverse();
  return `<div class="board" role="grid" aria-label="Papan catur">${squares.map(([f, r, p], i) => {
    const sq = 'abcdefgh'[f] + (8 - r);
    const cls = [(f + r) % 2 ? 'dark' : '', last.includes(sq) ? 'last' : '', sel === sq ? 'selected' : '',
      targets.includes(sq) ? 'target' : '', p ? 'occupied' : '',
      movable.includes(sq) || targets.includes(sq) ? 'can' : ''].join(' ');
    const color = p && (p === p.toUpperCase() ? 'w' : 'b');
    return `<button class="${cls}" data-sq="${sq}" aria-label="${sq}${p ? ` ${NAMES[p.toLowerCase()]} ${color === 'w' ? 'putih' : 'hitam'}` : ''}">
      ${p ? `<span class="piece-${color}">${GLYPH[p.toLowerCase()]}︎</span>` : ''}
      ${i % 8 === 0 ? `<span class="coord rank">${8 - r}</span>` : ''}
      ${i >= 56 ? `<span class="coord file">${'abcdefgh'[f]}</span>` : ''}</button>`;
  }).join('')}</div>`;
}
const diceHtml = (values, used = [], rolling = false) => `<div class="row">${values.map((v, i) =>
  `<div class="die ${used.includes(i) ? 'used' : ''} ${rolling ? 'rolling' : ''}">
   <b>${v} ${GLYPH[DIE[v]]}︎</b><small>${used.includes(i) ? 'terpakai' : NAMES[DIE[v]]}</small></div>`).join('')}</div>`;

// ---- auth + profile screens ----
function avatarPicker(key, current) {
  return `<div class="stack" data-picker="${key}"><span>Avatar</span><div class="row presets">${PRESETS.map(a =>
    `<button type="button" class="ghost" data-preset="${a}" aria-pressed="${a === current}">${a}</button>`).join('')}</div>
    <label>Atau unggah foto<input type="file" accept="image/*" data-upload></label>
    <input type="hidden" name="${key}" value="${esc(current)}"></div>`;
}
function wirePickers(root) {
  root.querySelectorAll('[data-picker]').forEach(box => {
    const hidden = box.querySelector('input[type=hidden]');
    const press = a => box.querySelectorAll('[data-preset]').forEach(b => b.setAttribute('aria-pressed', b.dataset.preset === a));
    box.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => { hidden.value = b.dataset.preset; press(hidden.value); });
    box.querySelector('[data-upload]').onchange = async e => {
      try {
        const img = await createImageBitmap(e.target.files[0]);
        const c = document.createElement('canvas'); c.width = c.height = 128;
        const side = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 128, 128);
        hidden.value = c.toDataURL('image/jpeg', .85); press(null); toast('Foto siap disimpan.');
      } catch (err) { console.error(err); toast('Gambar tidak bisa dibaca.'); }
    };
  });
}
// Form helper: disables the submit button while the request runs (no double submits).
function onSubmit(form, fn) {
  form.onsubmit = async e => {
    e.preventDefault();
    const btn = form.querySelector('button:not([type=button])');
    if (btn) btn.disabled = true;
    try { await fn(Object.fromEntries(new FormData(form))); }
    catch (err) { toast(friendly(err)); }
    finally { if (btn && btn.isConnected) btn.disabled = false; }
  };
}

  async replay(id) {
    const d = await rpc('get_game_detail', { p_game_id: +id }), g = d.game;
    // Frames are built only from stored rolls, moves and FENs — no new dice are ever generated.
    const frames = [{ fen: g.starting_fen }];
    for (const turn of d.turns) {
      const roll = d.rolls.find(r => r.turn_id === turn.id);
      if (!roll) continue;
      const moves = d.moves.filter(m => m.turn_id === turn.id);
      if (!moves.length) frames.push({ fen: frames.at(-1).fen, roll, turn, used: [] });
      const used = [];
      for (const m of moves) { used.push(...m.die_indexes); frames.push({ fen: m.fen_after, roll, turn, move: m, used: [...used] }); }
    }
    return () => {
      let at = 0;
      view.innerHTML = `<h1>Replay ${esc(g.game_code)}</h1><div class="match"><div id="rboard"></div>
        <div class="card stack"><div id="rinfo"></div><div class="row">

           `<button class="ghost" data-r="${k}">${l}</button>`).join('')}</div>
        <a href="#match/${g.id}">Kembali ke detail</a></div></div>`;
      const draw = () => {
        const f = frames[at], m = f.move;
        $('#rboard').innerHTML = boardHtml(f.fen, { flip: flipFor(g.player_white), last: m ? [m.from_square, m.to_square] : [] });
        $('#rinfo').innerHTML = `<p>Bingkai ${at} / ${frames.length - 1} · Langkah ${frames.slice(0, at + 1).filter(y => y.move).length} / ${d.moves.length}</p>
          ${f.roll ? `<p>Giliran ${f.turn.turn_number}: <strong>${name(f.turn.player_id)}</strong></p>${diceHtml(f.roll.dice_values, f.used)}
          <p>${m ? `${NAMES[m.piece_type]} ${esc(m.move_san)}${m.captured_piece ? ` · memakan ${NAMES[m.captured_piece]}` : ''}` : 'Tidak ada langkah legal pada lemparan ini.'}</p>`
          : '<p>Posisi awal.</p>'}`;
      };
      const stop = () => clearInterval(replayTimer);
      const actions = {
        first: () => { stop(); at = 0; }, back: () => { stop(); at = Math.max(0, at - 1); },
        fwd: () => { stop(); at = Math.min(frames.length - 1, at + 1); },
        end: () => { stop(); at = frames.length - 1; }, pause: stop, restart: () => { stop(); at = 0; },
        play: () => { stop(); replayTimer = setInterval(() => { if (at >= frames.length - 1) return stop(); at++; draw(); }, 900); },
      };
      view.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { actions[b.dataset.r](); draw(); });
      draw();
    };
  },

      view.innerHTML = `<h1>Settings</h1><div class="grid"><form class="card stack" id="profile"><h2>Profil saya</h2>

        <label>Nama tampilan<input name="displayName" maxlength="24" value="${esc(me.display_name)}" required></label>
        ${avatarPicker('avatar', me.avatar)}<button>Simpan profil</button></form>
        <div class="card stack"><h2>Preferensi perangkat ini</h2>
        <label class="inline"><input type="checkbox" id="sound" ${prefs.sound ? 'checked' : ''}>Suara</label>
        <label class="inline"><input type="checkbox" id="animation" ${prefs.animation ? 'checked' : ''}>Animasi dadu</label>
        <label>Orientasi papan<select id="orientation"><option value="white">Putih selalu di bawah</option>
        <option value="mine" ${prefs.orientation === 'mine' ? 'selected' : ''}>Warnaku di bawah</option></select></label>
        <button class="ghost" id="logout">Keluar dari perangkat ini</button></div>
        <div class="card"><h2>Aturan (dice3-kingcapture-v1)</h2><ul>
        <li>3 dadu per giliran. 1 Pion, 2 Kuda, 3 Gajah, 4 Benteng, 5 Menteri, 6 Raja.</li>
        <li>Satu dadu untuk satu langkah, urutan bebas.</li>
        <li>Wajib memakai dadu sebanyak mungkin. Dadu yang tidak bisa dipakai hangus.</li>
        <li>Tidak ada skak. Menang dengan memakan raja.</li>
        <li>Rokade memakai dadu Raja dan Benteng.</li>
        <li>En passant berlaku pada giliran lawan berikutnya.</li>
        <li>Remis: sepakat, tinggal dua raja, atau 100 giliran tanpa makan dan tanpa gerak pion.</li></ul></div></div>`;
      wirePickers(view);
      onSubmit($('#profile'), async d => {
        await rpc('update_profile', { p_display_name: d.displayName, p_avatar: d.avatar });
        await fetchPlayers(); toast('Profil disimpan.'); render(true);
      });
      $('#sound').onchange = e => { prefs.sound = e.target.checked; savePrefs(); };
      $('#animation').onchange = e => { prefs.animation = e.target.checked; savePrefs(); };
      $('#orientation').onchange = e => { prefs.orientation = e.target.value; savePrefs(); };
      $('#logout').onclick = signOut;
    };
  },
};

// ---- game actions (every one carries the version we saw; the DB rejects stale/duplicate submits) ----
const ACTIONS = {
  accept: id => ['accept_match', { p_game_id: id }], cancel: id => ['cancel_match', { p_game_id: id }],
  roll: id => ['roll_dice', { p_game_id: id }], resign: id => ['resign_match', { p_game_id: id }],
  draw: id => ['offer_end', { p_game_id: id, p_kind: 'draw' }], abandon: id => ['offer_end', { p_game_id: id, p_kind: 'abandon' }],
  decline: id => ['decline_offer', { p_game_id: id }],
};
async function gameAction(act) {
  if (!live || !ACTIONS[act]) return;
  const g = live.game;
  if (act === 'resign' && !await confirmBox('Menyerah?', 'Lawanmu akan dicatat sebagai pemenang.')) return;
  if (act === 'abandon' && !await confirmBox('Ajukan berhenti?', 'Pertandingan dihentikan tanpa hasil bila lawan setuju.')) return;
  if (act === 'cancel' && g.created_by !== boot.me && !await confirmBox('Tolak ajakan?', 'Pertandingan akan dibatalkan.')) return;
  if (act === 'roll') beep();
  const [fn, args] = ACTIONS[act](g.id);
  run(() => rpc(fn, { ...args, p_expected_version: g.version }));
}
function clickSquare(sq) {
  if (busy || !live) return;
  const options = live.legal.filter(m => m.from === selected && m.to === sq);
  if (!options.length) {
    selected = live.legal.some(m => m.from === sq) && selected !== sq ? sq : null;
    return render();
  }
  const g = live.game;
  const send = uci => { selected = null; beep(); run(() => rpc('make_move', { p_game_id: g.id, p_uci: uci, p_expected_version: g.version })); };
  if (options.length === 1) return send(options[0].uci);
  modal.innerHTML = `<h2>Promosi pion</h2><form method="dialog" class="row">${options.map(o =>
    `<button value="${o.uci}">${NAMES[o.promo]}</button>`).join('')}<button class="ghost" value="">Batal</button></form>`;
  modal.returnValue = '';
  modal.onclose = () => modal.returnValue && send(modal.returnValue);
  modal.showModal();
}

// Satu listener untuk seluruh papan. Tetap bekerja meskipun isi view dirender ulang.
view.addEventListener('click', event => {
  const square = event.target.closest('.board button[data-sq]');
  if (!square || !view.contains(square)) return;
  event.preventDefault();
  clickSquare(square.dataset.sq);
});
// Serializes user actions: while one request is in flight, further clicks are ignored (no duplicate submits).
async function run(fn) {
  if (busy) return;
  busy = true;
  try { await fn(); }
  catch (e) { console.error(e); toast(isStale(e) ? 'Status berubah, memuat ulang…' : friendly(e)); }
  finally { busy = false; }
  await sync();
}


// ---- header (gaya Tancredi Clan): brand kiri, menu kanan; dibangun sekali, hanya status aktif yang diperbarui ----
const ICONS = {
  dashboard: ['#6366f1', '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'],
  play: ['#16a34a', '<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="9" r="1"/><circle cx="9" cy="15" r="1"/><circle cx="15" cy="15" r="1"/>'],
  players: ['#7c3aed', '<circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0M16 4.5a3.5 3.5 0 0 1 0 7M22 20a7 7 0 0 0-5-6.7"/>'],
  history: ['#0e7490', '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
  statistics: ['#2563eb', '<path d="M3 21h18M4 21v-6h5v6M9.5 21V5h5v16M15 21v-10h5v10"/>'],
  settings: ['#64748b', '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>'],
  logout: ['#e11d48', '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>'],
};
const icon = k => `<span class="menu-icon" style="color:${ICONS[k][0]}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICONS[k][1]}</svg></span>`;
function closeMenu() {
  $('#menuPanel').hidden = true; $('#menuBtn').setAttribute('aria-expanded', 'false');
}
function buildNav() {
  const nav = $('#nav');
  if (nav.dataset.built) return;
  nav.dataset.built = '1';
  nav.innerHTML = `<div class="shell"><div class="site-header">
    <a class="site-brand" href="#dashboard" aria-label="Dice Chess — Dashboard"><span class="brand-mark" aria-hidden="true">♞</span>
      <span class="brand-text"><span class="brand-title">DICE CHESS</span><span class="brand-sub">Dua pemain · tiga dadu</span></span></a>
    <div class="header-actions"><span class="conn" id="conn">Menyambung…</span>
      <button class="icon-btn ghost" id="menuBtn" type="button" aria-label="Buka menu navigasi" aria-expanded="false" aria-controls="menuPanel">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="nav-menu-panel" id="menuPanel" hidden>
        ${NAV.map(([k, l]) => `<a class="nav-menu-item" href="#${k}" data-nav="${k}">${icon(k)}${l}</a>`).join('')}
        <div class="nav-menu-divider"></div>
        <button class="nav-menu-item" id="menuLogout" type="button">${icon('logout')}Keluar</button></div></div></div>
    <nav class="site-nav" aria-label="Utama">${NAV.map(([k, l]) => `<a class="tab-btn" href="#${k}" data-nav="${k}">${l}</a>`).join('')}</nav></div>`;
  $('#menuBtn').onclick = e => { e.stopPropagation(); const open = $('#menuPanel').hidden; $('#menuPanel').hidden = !open;
    $('#menuBtn').setAttribute('aria-expanded', String(open)); };
  $('#menuPanel').addEventListener('click', e => { if (e.target.closest('a')) closeMenu(); });
  $('#menuLogout').onclick = () => { closeMenu(); signOut(); };
  document.addEventListener('click', e => { if (!e.target.closest('.header-actions')) closeMenu(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
  setConn(connState);
}
function updateNav(page) {
  document.querySelectorAll('#nav [data-nav]').forEach(el => {
    const on = el.dataset.nav === page;
    el.classList.toggle('active', on);
    if (on) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current');
  });
}

// ---- rendering ----
let renderId = 0;
async function render(showLoading = false) {
  if (!boot.me) return;
  const id = ++renderId;
  const [route, arg] = (location.hash.slice(1) || 'dashboard').split('/');
  const page = pages[route] ? route : 'dashboard';
  buildNav(); updateNav(page);
  if (showLoading) loading();
  try {
    const paint = await pages[page](arg);
    if (id !== renderId) return;                // a newer render superseded this one
    clearInterval(replayTimer);
    paint();
  } catch (e) {
    console.error('[render]', e);
    if (id === renderId) errorBox(e, () => render(true));
  }
}
function setConn(state) {
  connState = state;
  const el = $('#conn');
  if (el) { el.className = 'conn ' + (state === 'ok' ? 'ok' : state === 'bad' ? 'bad' : '');
    el.textContent = state === 'ok' ? 'Terhubung' : state === 'bad' ? 'Terputus' : 'Menyambung…'; }
}

// ---- synchronisation: Realtime is only a "something changed" hint; get_live_state() is the truth ----
let syncing = false, again = false;
function scheduleSync(delay = 120) { clearTimeout(syncTimer); syncTimer = setTimeout(sync, delay); }
async function sync() {
  if (!boot.me) return;
  if (syncing) { again = true; return; }
  syncing = true;
  try {
    do {
      again = false;
      const next = await rpc('get_live_state');
      // never let an older snapshot overwrite a newer one
      if (next && live && next.game.id === live.game.id && next.game.version < live.game.version) continue;
      const changed = JSON.stringify([live?.game.id, live?.game.version]) !== JSON.stringify([next?.game.id, next?.game.version]);
      live = next;
      if (changed) selected = null;
      const page = location.hash.slice(1).split('/')[0] || 'dashboard';
      if (live?.game.status === 'active') watching = live.game.id;
      else if (watching && !live) {
        const finished = watching; watching = null;
        if (page === 'play') { location.hash = 'match/' + finished; continue; }
      }
      if (changed && (page === 'play' || page === 'dashboard')) await render();
      if (changed && page !== 'play' && live?.game.status === 'waiting' && live.game.created_by !== boot.me)
        toast('Ada ajakan bermain. Buka menu Play.');
    } while (again);
    if (connState !== 'ok' && channels.length) setConn('ok');
  } catch (e) { console.error('[sync]', e); setConn('bad'); toast(friendly(e)); }
  finally { syncing = false; }
}

function teardownRealtime() {
  clearInterval(pollTimer); clearTimeout(syncTimer);
  channels.forEach(c => sb.removeChannel(c)); channels = [];
}
function setupRealtime() {
  teardownRealtime();
  const games = sb.channel('dice-chess-games')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'game_sessions' }, () => scheduleSync(80))
    .subscribe(status => {
      if (status === 'SUBSCRIBED') { setConn('ok'); scheduleSync(0); }       // (re)connected: refetch authoritative state
      else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') setConn('bad');
    });
  const presence = sb.channel('dice-chess-presence', { config: { presence: { key: boot.me } } });
  presence.on('presence', { event: 'sync' }, () => {
    online = Object.keys(presence.presenceState());
    const page = location.hash.slice(1).split('/')[0];
    if (page === 'play' && !busy) render();
  }).subscribe(async status => { if (status === 'SUBSCRIBED') await presence.track({ at: Date.now() }); });
  channels = [games, presence];
  // Safety net if a realtime message is ever missed.
  pollTimer = setInterval(() => { if (!document.hidden) sync(); }, 15000);
}
window.addEventListener('online', () => { scheduleSync(0); });
window.addEventListener('offline', () => setConn('bad'));
document.addEventListener('visibilitychange', () => { if (!document.hidden && boot.me) scheduleSync(0); });
window.addEventListener('hashchange', () => {
  if (!boot.me) return;
  selected = null; $('#toast').textContent = ''; render(true);
});

// ---- startup ----
function normalizeSupabaseUrl(raw) {
  let u;
  try { u = new URL(String(raw || '').trim()); }
  catch { throw new Error('SUPABASE_URL tidak valid. Isi dengan URL Project Supabase, contoh https://xxxx.supabase.co'); }
  if (u.protocol !== 'https:' && u.hostname !== 'localhost')
    throw new Error('SUPABASE_URL harus menggunakan HTTPS.');

  // URL project harus berupa root domain. Jika tanpa sengaja yang disalin
  // adalah ...supabase.co/rest/v1, Auth akan salah mengarah ke
  // /rest/v1/auth/v1/token (404). Bersihkan suffix API tersebut otomatis.
  u.pathname = u.pathname.replace(/\/(?:rest|auth|storage)\/v1(?:\/.*)?$/i, '');
  if (u.pathname && u.pathname !== '/')
    throw new Error('SUPABASE_URL harus URL utama project, bukan URL endpoint /rest/v1.');
  return u.origin;
}

async function start(route) {
  loading();
  try {
    if (!window.supabase) throw new Error('Library Supabase gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.');
    if (/YOUR-/.test(CONFIG.SUPABASE_URL + CONFIG.SUPABASE_KEY)) return configScreen();
    const projectUrl = normalizeSupabaseUrl(CONFIG.SUPABASE_URL);
    if (!CONFIG.SUPABASE_KEY || CONFIG.SUPABASE_KEY.startsWith('YOUR-'))
      throw new Error('SUPABASE_KEY belum diisi. Gunakan publishable key atau anon key, bukan service_role.');
    console.info('[Dice Chess] Supabase project:', projectUrl);
    sb ||= window.supabase.createClient(projectUrl, CONFIG.SUPABASE_KEY,
      { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
    const { data: { session }, error } = await sb.auth.getSession();
    if (error) throw error;
    if (!session) return loginScreen();
    const info = await rpc('get_session_info');
    if (!info.registered) return claimScreen(info);
    boot.me = session.user.id;
    await fetchPlayers();
    $('#nav').hidden = false;
    if (route) history.replaceState(null, '', '#' + route);
    live = await rpc('get_live_state');
    if (live?.game.status === 'active') watching = live.game.id;
    setupRealtime();
    await render(true);
  } catch (e) {
    console.error('[start]', e);
    errorBox(new Error(friendly(e)), () => start(route));
  }
}
start();
})();
