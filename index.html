<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#FDF9F3">
<title>Dice Chess</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dice Chess">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Dice Chess — Velvet Cocoa / Espresso, minimalis & elegan (mode terang saja). Font: Inter. */
:root {
  color-scheme: only light;
  --cream:#FDF9F3; --paper:#F2E8DA; --accent:#3B2418; --accent-dark:#573726; --accent-soft:#E4D3BE; --on-accent:#FDF9F3;
  --caramel:#BE9D83; --cocoa:#6B4A37; --cocoa-dark:#4E3222; --espresso:#3B2418;
  --line:#E2D2BD; --line-2:#CFBAA1; --muted:#755D4D; --soft:#E8DAC6; --tint:#FAF4EB;
  --danger:#9A3324; --ok:#2F6B3A;
  --radius:12px; --radius-lg:18px;
  --shadow:0 1px 2px rgba(59,36,24,.04), 0 8px 24px rgba(59,36,24,.07);
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body { margin:0; min-height:100vh; background:var(--cream); color:var(--espresso);
  font:400 15px/1.6 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing:antialiased; }
h1,h2,h3 { margin:0 0 10px; line-height:1.25; letter-spacing:-.02em; color:var(--espresso); font-weight:600; }
h1 { font-size:1.6rem; } h2 { font-size:1.35rem; } h3 { font-size:1rem; }
p { margin:0; }
a { color:var(--cocoa); }
code { background:var(--soft); padding:1px 6px; border-radius:6px; font-size:.88em; }
.shell, main { max-width:64rem; margin:0 auto; padding-left:1.25rem; padding-right:1.25rem; }
main { padding-bottom:4rem; }
@media (min-width:720px) { .shell, main { padding-left:2rem; padding-right:2rem; } }

/* ---- Header ---- */
#nav { padding-top:1.25rem; margin-bottom:1.75rem; }
.site-header { display:flex; align-items:center; justify-content:space-between; gap:1rem; }
.header-left { position:relative; min-width:0; }
.profile-btn { display:flex; align-items:center; gap:.75rem; padding:4px 14px 4px 4px; min-height:52px; background:transparent;
  color:var(--espresso); border:1px solid transparent; border-radius:999px; text-align:left; max-width:100%; }
.profile-btn:hover:not(:disabled), .profile-btn[aria-expanded=true] { background:var(--paper); border-color:var(--line); }
.profile-btn .avatar { width:44px; height:44px; box-shadow:0 0 0 2px var(--cream), 0 0 0 3px var(--caramel); }
.profile-text { display:flex; flex-direction:column; min-width:0; line-height:1.25; }
.profile-text b { font-size:.95rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.profile-text small { font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:500; }
.install-btn { gap:8px; padding:8px 16px; border-radius:999px; }
.ico { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
@media (max-width:380px) { .install-btn .lbl { display:none; } .install-btn { padding:8px 12px; } }

/* kartu profil (muncul saat avatar diketuk) */
.profile-card { position:absolute; z-index:1000; left:0; top:calc(100% + 10px); width:min(360px, calc(100vw - 2.5rem));
  max-height:calc(100vh - 110px); overflow-y:auto; overscroll-behavior:contain;
  padding:1.1rem; background:var(--paper); border:1px solid var(--line-2); border-radius:var(--radius-lg);
  box-shadow:0 20px 50px rgba(59,36,24,.18); display:flex; flex-direction:column; gap:.9rem; }
.profile-card .avatar.lg { width:60px; height:60px; font-size:30px; }
.mini-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.mini-stats div { background:var(--tint); border:1px solid var(--line); border-radius:var(--radius); padding:8px 6px; text-align:center; }
.mini-stats b { display:block; font-size:1.1rem; font-weight:600; font-variant-numeric:tabular-nums; }
.mini-stats span { font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
.menu-item { width:100%; justify-content:flex-start; gap:.75rem; background:transparent; color:var(--espresso); border:0; min-height:44px;
  padding:8px 10px; font-weight:500; border-radius:10px; }
.menu-item:hover:not(:disabled) { background:var(--soft); }
.menu-item.danger-text { color:var(--danger); }
.menu-divider { height:1px; background:var(--line); margin:0 4px; }
.pref { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:40px; padding:0 10px; font-size:.9rem; font-weight:500; color:var(--espresso); }
.pref select { min-height:38px; padding:4px 10px; font-size:.85rem; }

/* ---- Bagian halaman ---- */
.sec { margin-top:3rem; } .sec:first-child { margin-top:0; }
.sec-head { display:flex; align-items:baseline; gap:.75rem; margin-bottom:1rem; }
.sec-head h2 { margin:0; white-space:nowrap; }
.sec-no { font-size:.75rem; font-weight:600; letter-spacing:.12em; color:var(--cocoa); font-variant-numeric:tabular-nums; }
.sec-head::after { content:""; flex:1; height:1px; background:var(--line-2); order:3; align-self:center; }

.card { background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-lg); padding:1.35rem; box-shadow:var(--shadow); }
a.card { display:block; transition:border-color .15s, transform .15s; }
a.card:hover { border-color:var(--caramel); }
.card:not(.stack) > * + * { margin-top:.75rem; }
.card:not(.stack) > h2 + *, .card:not(.stack) > h3 + * { margin-top:.5rem; }
.grid { display:grid; gap:1.25rem; grid-template-columns:repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.stack { display:flex; flex-direction:column; gap:1.25rem; }
.card.stack { gap:1rem; }
.row { display:flex; flex-wrap:wrap; align-items:center; gap:.75rem; }
.between { justify-content:space-between; }
.muted { color:var(--muted); font-size:.85rem; }

/* ---- Kontrol ---- */
button, .button, select, input { font:inherit; font-size:.875rem; min-height:44px; border-radius:var(--radius); padding:8px 18px; }
button, .button { background:var(--cocoa); color:var(--cream); border:1px solid var(--cocoa); font-weight:500; cursor:pointer; text-decoration:none;
  display:inline-flex; align-items:center; justify-content:center; transition:background .15s, border-color .15s; letter-spacing:.005em; }
button:hover:not(:disabled), .button:hover { background:var(--cocoa-dark); border-color:var(--cocoa-dark); }
button.ghost, .button.ghost { background:var(--paper); color:var(--espresso); border-color:var(--line-2); }
button.ghost:hover:not(:disabled), .button.ghost:hover { background:var(--soft); border-color:var(--caramel); }
button.danger { background:var(--danger); border-color:var(--danger); }
button:disabled { opacity:.45; cursor:not-allowed; }
:focus-visible { outline:2px solid var(--cocoa); outline-offset:2px; }
select, input { background:var(--paper); color:var(--espresso); border:1px solid var(--line-2); max-width:100%; }
select:focus, input:focus { outline:none; border-color:var(--cocoa); box-shadow:0 0 0 3px rgba(59,36,24,.18); }
input[type=checkbox] { min-height:0; width:20px; height:20px; padding:0; accent-color:var(--cocoa); }
input[type=file] { padding:8px; font-size:.8rem; }
label { display:flex; flex-direction:column; gap:6px; font-size:.78rem; font-weight:500; color:var(--muted); letter-spacing:.02em; }
.avatar { width:44px; height:44px; flex:none; border-radius:50%; background:var(--soft); color:var(--cocoa); border:1px solid var(--line-2);
  display:inline-grid; place-items:center; font-size:22px; object-fit:cover; }
.presets button { width:44px; padding:0; font-size:20px; }
.presets button[aria-pressed=true] { background:var(--cocoa); color:var(--cream); border-color:var(--cocoa); }

/* ---- Statistik + tabel ---- */
dl.stats { display:grid; grid-template-columns:1fr auto; gap:0; margin:12px 0 0; }
dl.stats dt, dl.stats dd { padding:9px 0; border-bottom:1px solid var(--line); margin:0; }
dl.stats dt { color:var(--muted); font-size:.875rem; }
dl.stats dd { padding-left:12px; text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
dl.stats dt:nth-last-of-type(1), dl.stats dd:last-of-type { border-bottom:0; }
.versus { font-size:2rem; font-weight:600; letter-spacing:-.03em; margin:0; font-variant-numeric:tabular-nums; }
.table { overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-size:.875rem; }
th { text-align:left; padding:10px 8px; font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600; border-bottom:1px solid var(--line-2); white-space:nowrap; }
td { padding:10px 8px; border-bottom:1px solid var(--line); }
ul { padding-left:1.2rem; margin:0; } li { margin:6px 0; font-size:.9rem; }

/* ---- Papan ---- */
.match { display:grid; gap:1.5rem; grid-template-columns:minmax(0,1fr); }
@media (min-width:900px) { .match { grid-template-columns:minmax(0,540px) minmax(0,1fr); align-items:start; } }
.board { display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); grid-template-rows:repeat(8,minmax(0,1fr));
  width:100%; max-width:540px; margin:12px auto; aspect-ratio:1; border:1px solid var(--cocoa); border-radius:var(--radius);
  overflow:hidden; container-type:inline-size; box-shadow:var(--shadow); }
.board button { position:relative; min-height:0; min-width:0; padding:0; border:0; border-radius:0; background:#F2E8DA; color:var(--espresso);
  display:grid; place-items:center; font:9.5cqw/1 "Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif; cursor:default; }
.board button:hover:not(:disabled) { background:#F2E8DA; }
.board button.dark, .board button.dark:hover:not(:disabled) { background:var(--caramel); }
.board button.can { cursor:pointer; }
.board button.last { box-shadow:inset 0 0 0 100px rgba(59,36,24,.20); }
.board button.selected { box-shadow:inset 0 0 0 3px var(--espresso), inset 0 0 0 100px rgba(59,36,24,.28); }
.board button.target::after { content:""; position:absolute; width:28%; height:28%; border-radius:50%; background:rgba(59,36,24,.5); }
.board button.target.occupied::after { width:88%; height:88%; background:none; border:3px solid rgba(59,36,24,.55); }
.piece-w { color:#fff; -webkit-text-stroke:1.5px var(--espresso); }
.piece-b { color:var(--espresso); }
.coord { position:absolute; font:600 2.1cqw 'Inter',system-ui; color:var(--cocoa); }
.coord.file { right:3px; bottom:1px; } .coord.rank { left:3px; top:1px; }

/* ---- Dadu ---- */
.die { width:68px; height:68px; border:1px solid var(--line-2); border-radius:var(--radius); background:var(--paper); color:var(--espresso);
  display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.1; box-shadow:var(--shadow); }
.die b { font-size:2.1rem; font-weight:400; line-height:1; color:var(--cocoa); }
.dice-line { letter-spacing:.2em; font-size:1.05rem; color:var(--cocoa); }
.die.used { opacity:.45; border-style:dashed; box-shadow:none; }
.die.rolling { animation:roll .5s ease-out; }
@keyframes roll { from { transform:rotate(-200deg) scale(.6); } to { transform:none; } }
.turn { border-left:3px solid var(--cocoa); }
[data-me] { cursor:pointer; }

/* ---- Status / auth / dialog / toast ---- */
.center { text-align:center; padding:56px 12px; color:var(--muted); font-size:.9rem; }
.spinner { width:22px; height:22px; margin:0 auto 10px; border-radius:50%; border:2px solid var(--line-2); border-top-color:var(--cocoa); animation:spin .7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.errbox { border-left:3px solid var(--danger); }
.auth { max-width:420px; margin:40px auto; }
.auth h1 { text-align:center; margin-bottom:0; } .auth > .muted { text-align:center; }
.logo-mark { width:72px; height:72px; border-radius:18px; display:block; margin:0 auto; box-shadow:var(--shadow); }
dialog { border:1px solid var(--line-2); border-radius:var(--radius-lg); background:var(--paper); color:var(--espresso);
  width:min(92vw,440px); padding:1.5rem; box-shadow:0 20px 50px rgba(59,36,24,.25); max-height:88vh; }
dialog p { color:var(--muted); margin-bottom:14px; }
dialog::backdrop { background:rgba(59,36,24,.45); }
#toast { position:fixed; left:16px; right:16px; bottom:16px; margin:auto; max-width:420px; z-index:2000; font-size:.9rem;
  background:var(--espresso); color:var(--cream); border-radius:var(--radius); padding:12px 16px; box-shadow:0 16px 40px rgba(59,36,24,.3); }
#toast:empty { display:none; }
@media (max-width:520px) { #nav { padding-top:.75rem; } h1 { font-size:1.4rem; } .die { width:60px; height:60px; } .die b { font-size:1.9rem; } .sec { margin-top:2.5rem; } }

/* ---- Head to head: tabel perbandingan ---- */
.card.flush { padding:0; overflow:hidden; }
.cmp-scroll { overflow-x:auto; }
table.cmp { width:100%; table-layout:fixed; border-collapse:collapse; font-size:.9rem; }
.cmp col.first, .cmp th:first-child { width:44%; }
.cmp th { padding:14px 16px; text-transform:none; letter-spacing:0; font-size:.85rem; font-weight:600; color:var(--muted);
  border-bottom:1px solid var(--line-2); text-align:left; white-space:nowrap; }
.cmp th.num { text-align:right; color:var(--espresso); }
.cmp-player { display:inline-flex; align-items:center; gap:8px; max-width:100%; }
.cmp-player span:last-child { overflow:hidden; text-overflow:ellipsis; }
.cmp-player .avatar { width:28px; height:28px; font-size:15px; }
.cmp td { padding:13px 16px; border-bottom:1px solid var(--line); color:var(--espresso); }
.cmp tbody tr:last-child td { border-bottom:0; }
.cmp tbody tr:nth-child(odd) { background:var(--paper); }
.cmp tbody tr:nth-child(even) { background:#F5EDE1; }
.cmp tbody tr:hover { background:var(--soft); }
.cmp tbody tr:hover td { background:transparent; }
.cmp td.num { text-align:right; font-variant-numeric:tabular-nums; }
.cmp td.shared { color:var(--muted); }
.cmp-label { display:inline-flex; align-items:center; gap:8px; }
.cmp-glyph { font-weight:700; }
.cmp .best { display:inline-block; font-weight:700; background:var(--soft); border:1px solid var(--line-2); border-radius:8px; padding:1px 10px; }
@media (max-width:520px) { .cmp th, .cmp td { padding:12px 10px; font-size:.84rem; } .cmp th:first-child { width:40%; } }

/* ---- Game history: satu baris per match, belang ---- */
.hlist { padding:0; }
.hrow { display:flex; align-items:center; gap:12px; padding:10px 16px; min-height:68px; border-bottom:1px solid var(--line); }
.hrow:last-child { border-bottom:0; }
.hrow:nth-child(odd) { background:var(--paper); }
.hrow:nth-child(even) { background:#F5EDE1; }
.hrow:hover { background:var(--soft); }
.hmain { flex:1; min-width:0; display:flex; align-items:center; gap:12px; color:inherit; text-decoration:none; align-self:stretch; }
.hmain .avatar { width:42px; height:42px; border-radius:10px; }
.htext { display:flex; flex-direction:column; min-width:0; line-height:1.3; }
.htext b { font-weight:600; font-size:.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.htext small { font-size:.75rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.colordot { width:28px; height:28px; flex:none; border-radius:50%; display:grid; place-items:center; font-size:16px; line-height:1;
  border:1px solid var(--line-2); background:var(--paper); color:var(--espresso); }
.colordot.b { background:var(--espresso); border-color:var(--espresso); color:var(--cream); }
.mark { width:22px; height:22px; flex:none; border-radius:6px; display:grid; place-items:center; font-weight:700; font-size:.95rem; line-height:1; color:#fff; }
.mark.win { background:var(--ok); } .mark.loss { background:var(--danger); }
.mark.draw { background:var(--caramel); } .mark.none { background:var(--line-2); color:var(--muted); }
.button.replay { width:48px; min-height:48px; padding:0; border-radius:var(--radius); }
.button.replay .ico { width:20px; height:20px; }
@media (max-width:520px) { .hmoves { display:none; } .hrow { gap:8px; padding:8px 10px; } .hmain { gap:8px; } .colordot { width:24px; height:24px; font-size:13px; }
  .hmain .avatar { width:38px; height:38px; } .button.replay { width:44px; min-height:44px; } }
@media (prefers-reduced-motion:reduce) { .die.rolling, .spinner { animation:none; } html { scroll-behavior:auto; } }

/* ==== Tata letak baru ==== */
.shell, main { max-width:48rem; }
body.playing .shell, body.playing main { max-width:64rem; }
@media (max-width:520px) { .shell, main { padding-left:.85rem; padding-right:.85rem; } }
button:not(.ghost):not(.profile-btn):not(.menu-item):not(.link):not(.danger):not(.board button), .button:not(.ghost):not(.replay) {
  background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }
button:not(.ghost):not(.profile-btn):not(.menu-item):not(.link):not(.danger):not(.board button):hover:not(:disabled), .button:not(.ghost):not(.replay):hover {
  background:var(--accent-dark); border-color:var(--accent-dark); }
.presets button[aria-pressed=true] { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.site-header { padding-bottom:1rem; border-bottom:1px solid var(--line-2); }
#nav { margin-bottom:1.25rem; }
.profile-text b { font-size:1.05rem; }
.profile-text small { display:flex; align-items:center; gap:5px; text-transform:none; letter-spacing:0; font-size:.82rem; }
.profile-text small .ico { width:15px; height:15px; }
.header-right { display:flex; align-items:center; gap:8px; }
.conn { display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:6px 16px; border-radius:999px; background:var(--soft); font-size:.85rem; font-weight:500; }
.conn::before { content:""; width:9px; height:9px; border-radius:50%; background:var(--ok); }
.conn.bad::before { background:var(--danger); } .conn.connecting::before { background:var(--caramel); }
.install-btn { width:44px; padding:0; }
.install-btn .lbl { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
.sec { margin-top:1.25rem; }
.title-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:.75rem; }
.title-row h2 { display:flex; align-items:center; gap:12px; margin:0; }
.title-row h2 .ico { width:26px; height:26px; }
button.link { background:none; border:0; padding:6px 0; color:var(--espresso); font-weight:600; text-decoration:underline; text-underline-offset:4px;
  text-decoration-color:var(--accent); text-decoration-thickness:3px; }
.panel { background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow); overflow:hidden; }
.panel > .title-row { padding:1rem 1.25rem .25rem; margin:0; min-height:62px; }
.versus-row { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:14px; }
.versus-row .row { flex-wrap:nowrap; min-width:0; padding-bottom:12px; border-bottom:1px solid var(--line); }
.versus-row .row > div { min-width:0; } .versus-row strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.versus-row .avatar { width:56px; height:56px; font-size:28px; }
.vs { width:56px; height:56px; border-radius:50%; display:grid; place-items:center; background:var(--accent-soft); font-weight:700; font-size:1.1rem; }
.colorpick { position:relative; display:block; }
.colorpick select { width:100%; padding-left:46px; min-height:50px; }
.swatch { position:absolute; left:16px; top:50%; width:20px; height:20px; margin-top:-10px; border-radius:50%; border:2px solid var(--espresso); background:#fff; pointer-events:none; }
.colorpick[data-color=b] .swatch { background:var(--espresso); }
.colorpick[data-color=random] .swatch { background:linear-gradient(90deg,#fff 50%,var(--espresso) 50%); }
.big { width:100%; min-height:56px; gap:10px; font-size:1rem; }
.note { display:flex; align-items:center; justify-content:center; gap:8px; padding:8px 12px; border-radius:var(--radius); background:var(--tint); color:var(--muted); font-size:.8rem; text-align:center; }
.cmp th, .cmp td { text-align:left; }
.cmp th.num, .cmp td.num { text-align:center; }
.cmp thead tr { background:var(--soft); }
.cmp .best { background:var(--accent); border-color:var(--accent); color:var(--on-accent); border-radius:999px; padding:1px 14px; }
.cmp-label { gap:14px; }
.cmp-label .ico { color:var(--cocoa); }
.hist-body { padding:0 .75rem .9rem; display:flex; flex-direction:column; gap:.75rem; }
.hist-body .filters { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; padding:0 .5rem; }
.hist-body .hlist { display:flex; flex-direction:column; gap:6px; }
.hist-body .hrow, .hist-body .hrow:nth-child(even) { background:var(--tint); border:1px solid var(--line); border-radius:14px; }
.colordot, .colordot.b { width:42px; height:42px; border-radius:10px; font-size:20px; }

// ---- ikon ----
const ICONS = {
  crown: '<path d="M4 18h16M4 15 3 7l5 4 4-6 4 6 5-4-1 8z"/>',

  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  trophy: '<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4c0 3 2 4 4 4M16 6h4c0 3-2 4-4 4M12 13v5M8 20h8"/>',
  cross: '<path d="M6 6l12 12M18 6 6 18"/>',
  percent: '<path d="M18 5 6 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/>',

};

// ---- helpers ----
let toastTimer;
function toast(message) {
  $('#toast').textContent = message;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('#toast').textContent = ''; }, 4500);
}
function beep() {
  if (!prefs.sound) return;
  try {
    const ctx = beep.ctx ||= new AudioContext(), o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 420; g.gain.setValueAtTime(.08, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .15);
    o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + .15);
  } catch { /* audio unavailable */ }
}
const isStale = e => /sudah berubah/i.test(e?.message || '');
function friendly(error) {
  const msg = error?.message || String(error);

  if (/JWT|expired|not authenticated/i.test(msg)) return 'Sesi berakhir. Silakan masuk lagi.';

}

}

// ---- board ----
function boardHtml(fen, { flip = false, last = [], sel = null, targets = [], movable = [] } = {}) {
  const squares = [];
  fen.split(' ')[0].split('/').forEach((row, r) => {
    let f = 0;
    for (const ch of row) {
      if (/\d/.test(ch)) for (let i = 0; i < +ch; i++) squares.push([f++, r, null]);
      else squares.push([f++, r, ch]);
    }
  });
  if (flip) squares.reverse();
  return `<div class="board" role="grid" aria-label="Papan catur">${squares.map(([f, r, p], i) => {
    const sq = 'abcdefgh'[f] + (8 - r);
    const cls = [(f + r) % 2 ? 'dark' : '', last.includes(sq) ? 'last' : '', sel === sq ? 'selected' : '',
      targets.includes(sq) ? 'target' : '', p ? 'occupied' : '',
      movable.includes(sq) || targets.includes(sq) ? 'can' : '', movable.includes(sq) ? 'movable' : ''].join(' ');
    const color = p && (p === p.toUpperCase() ? 'w' : 'b');
    return `<button class="${cls}" data-sq="${sq}" aria-label="${sq}${p ? ` ${NAMES[p.toLowerCase()]} ${color === 'w' ? 'putih' : 'hitam'}` : ''}">
      ${p ? `<span class="piece-${color}">${GLYPH[p.toLowerCase()]}︎</span>` : ''}
      ${i % 8 === 0 ? `<span class="coord rank">${8 - r}</span>` : ''}
      ${i >= 56 ? `<span class="coord file">${'abcdefgh'[f]}</span>` : ''}</button>`;
  }).join('')}</div>`;
}
const glyph = k => GLYPH[k] + '\uFE0E';           // \uFE0E = tampil sebagai teks, bukan emoji
const diceGlyphs = values => values.map(v => glyph(DIE[v])).join(' ');
const diceHtml = (values, used = [], rolling = false) => `<div class="row">${values.map((v, i) =>
  `<div class="die ${used.includes(i) ? 'used' : ''} ${rolling ? 'rolling' : ''}" role="img"
    aria-label="${NAMES[DIE[v]]}${used.includes(i) ? ', terpakai' : ''}"><b aria-hidden="true">${glyph(DIE[v])}</b></div>`).join('')}</div>`;
const flipFor = whiteId => prefs.orientation === 'mine' && boot.me !== whiteId;

// ---- auth + profile screens ----
function avatarPicker(key, current) {
  return `<div class="stack" data-picker="${key}"><span>Avatar</span><div class="row presets">${PRESETS.map(a =>
    `<button type="button" class="ghost" data-preset="${a}" aria-pressed="${a === current}">${a}</button>`).join('')}</div>
    <label>Atau unggah foto<input type="file" accept="image/*" data-upload></label>
    <input type="hidden" name="${key}" value="${esc(current)}"></div>`;
}
function wirePickers(root) {
  root.querySelectorAll('[data-picker]').forEach(box => {
    const hidden = box.querySelector('input[type=hidden]');
    const press = a => box.querySelectorAll('[data-preset]').forEach(b => b.setAttribute('aria-pressed', b.dataset.preset === a));
    box.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => { hidden.value = b.dataset.preset; press(hidden.value); });
    box.querySelector('[data-upload]').onchange = async e => {
      try {
        const img = await createImageBitmap(e.target.files[0]);
        const c = document.createElement('canvas'); c.width = c.height = 128;
        const side = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 128, 128);
        hidden.value = c.toDataURL('image/jpeg', .85); press(null); toast('Foto siap disimpan.');
      } catch (err) { console.error(err); toast('Gambar tidak bisa dibaca.'); }
    };
  });
}
// Form helper: disables the submit button while the request runs (no double submits).
function onSubmit(form, fn) {
  form.onsubmit = async e => {
    e.preventDefault();
    const btn = form.querySelector('button:not([type=button])');
    if (btn) btn.disabled = true;
    try { await fn(Object.fromEntries(new FormData(form))); }
    catch (err) { toast(friendly(err)); }
    finally { if (btn && btn.isConnected) btn.disabled = false; }
  };
}

// ---- Head to head: tabel perbandingan (gaya "Table Comparison" Tancredi Clan) ----
function headToHead(s) {
  const [a, b] = boot.players, A = s.players[a.id], B = s.players[b.id], h = s.headToHead, f = s.frequency;
  const num = v => Number(v).toLocaleString('id-ID');
  // [ikon, label, nilai A, nilai B, 'max' | null, format]
  const rows = [
    ['trophy', 'Menang', A.wins, B.wins, 'max', num],
    ['cross', 'Kalah', A.losses, B.losses, null, num],
    ['percent', 'Win rate', A.winRate, B.winRate, 'max', percent],
    ['equal', 'Remis', h.draws, h.draws, null, num],
    ...(h2hAll ? [
      ['flame', 'Streak menang terpanjang', A.longestStreak, B.longestStreak, 'max', num],
      ['flame', 'Streak menang saat ini', A.currentStreak, B.currentStreak, 'max', num],
    ] : []),
  ];
  const cell = (v, other, kind, fmt) =>
    `<td class="num">${kind === 'max' && Number(v) > Number(other) ? `<span class="best">${fmt(v)}</span>` : fmt(v)}</td>`;
  const shared = !h2hAll ? [] : [
    ['Total match selesai', h.total], ['Abandoned (tidak dihitung)', h.abandoned],
    ['Pemenang terakhir', h.mostRecentWinner ? name(h.mostRecentWinner) : '—'],

          : '<p>Posisi awal.</p>'}`;
      };
      const stop = () => clearInterval(replayTimer);
      const actions = {
        first: () => { stop(); at = 0; }, back: () => { stop(); at = Math.max(0, at - 1); },
        fwd: () => { stop(); at = Math.min(frames.length - 1, at + 1); },
        end: () => { stop(); at = frames.length - 1; }, pause: stop, restart: () => { stop(); at = 0; },
        play: () => { stop(); replayTimer = setInterval(() => { if (at >= frames.length - 1) return stop(); at++; draw(); }, 900); },
      };
      view.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { actions[b.dataset.r](); draw(); });
      draw();
    };
  },
};

// ---- game actions (every one carries the version we saw; the DB rejects stale/duplicate submits) ----
const ACTIONS = {
  accept: id => ['accept_match', { p_game_id: id }], cancel: id => ['cancel_match', { p_game_id: id }],
  roll: id => ['roll_dice', { p_game_id: id }], resign: id => ['resign_match', { p_game_id: id }],
  draw: id => ['offer_end', { p_game_id: id, p_kind: 'draw' }], abandon: id => ['offer_end', { p_game_id: id, p_kind: 'abandon' }],
  decline: id => ['decline_offer', { p_game_id: id }],
  endturn: id => ['end_turn', { p_game_id: id }],
};
async function gameAction(act) {
  if (!live || !ACTIONS[act]) return;
  const g = live.game;
  if (act === 'resign' && !await confirmBox('Menyerah?', 'Lawanmu akan dicatat sebagai pemenang.')) return;
  if (act === 'abandon' && !await confirmBox('Ajukan berhenti?', 'Pertandingan dihentikan tanpa hasil bila lawan setuju.')) return;
  if (act === 'cancel' && g.created_by !== boot.me && !await confirmBox('Tolak ajakan?', 'Pertandingan akan dibatalkan.')) return;
  if (act === 'endturn' && live.legal.length && !await confirmBox('Akhiri giliran?', 'Masih ada gerakan legal. Dadu yang tersisa akan hangus.')) return;
  const [fn, args] = ACTIONS[act](g.id);
  if (act === 'roll') {
    if (busy) return;
    beep();
    const button = $('.rollbtn');
    if (button) button.disabled = true;
    if (prefs.animation) $('.tray')?.classList.add('shaking');
  }
  await run(() => rpc(fn, { ...args, p_expected_version: g.version }));
  if (act === 'roll') paintSetup();   // pulihkan tombol bila lemparan gagal
}
function clickSquare(sq) {
  if (busy || !live) return;
  const options = live.legal.filter(m => m.from === selected && m.to === sq);
  if (!options.length) {
    selected = live.legal.some(m => m.from === sq) && selected !== sq ? sq : null;
    return paintSetup();
  }
  const g = live.game;
  const send = uci => { selected = null; beep(); run(() => rpc('make_move', { p_game_id: g.id, p_uci: uci, p_expected_version: g.version })); };
  if (options.length === 1) return send(options[0].uci);
  modal.innerHTML = `<h2>Promosi pion</h2><form method="dialog" class="row">${options.map(o =>
    `<button value="${o.uci}">${NAMES[o.promo]}</button>`).join('')}<button class="ghost" value="">Batal</button></form>`;
  modal.returnValue = '';
  modal.onclose = () => modal.returnValue && send(modal.returnValue);
  modal.showModal();
}

// Serializes user actions: while one request is in flight, further clicks are ignored (no duplicate submits).
async function run(fn) {
  if (busy) return;
  busy = true;
  try { await fn(); }
  catch (e) { console.error(e); toast(isStale(e) ? 'Status berubah, memuat ulang…' : friendly(e)); }
  finally { busy = false; }
  await sync();
}

let deferredInstall = null;
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
window.addEventListener('appinstalled', () => { deferredInstall = null; updateInstallVisibility(); toast('Dice Chess terpasang di perangkatmu.'); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('[sw]', e)));
}
function updateInstallVisibility() { const b = $('#installBtn'); if (b) b.hidden = isStandalone(); }
async function installApp() {
  if (deferredInstall) {
    const p = deferredInstall; deferredInstall = null;
    p.prompt();
    try { await p.userChoice; } catch { /* ignored */ }
    return;
  }
  const steps = isIOS()
    ? 'Di Safari, ketuk tombol <strong>Bagikan</strong> (kotak dengan panah ke atas), lalu pilih <strong>Tambah ke Layar Utama</strong>.'
    : 'Buka menu browser (⋮), lalu pilih <strong>Instal aplikasi</strong> atau <strong>Tambahkan ke layar utama</strong>. Di komputer, klik ikon instal di bilah alamat.';
  modal.innerHTML = `<h2>Unduh Dice Chess</h2><p>${steps}</p>
    <p class="muted">Pasang hanya bisa dari alamat https (GitHub Pages), bukan dari file yang dibuka langsung.</p>
    <form method="dialog" class="row"><button>Mengerti</button></form>`;
  modal.onclose = null; modal.returnValue = '';
  modal.showModal();
}
function closeProfile() {
  const c = $('#profileCard'), b = $('#profileBtn');
  if (c) c.hidden = true;
  if (b) b.setAttribute('aria-expanded', 'false');
}
function renderProfileCard() {
  const me = player(boot.me);
  const card = $('#profileCard');
  card.innerHTML = `<form class="stack" id="pfForm" style="gap:1rem"><h3 style="margin:0">Edit profil</h3>
    <label>Nama tampilan<input name="displayName" maxlength="24" value="${esc(me.display_name)}" required></label>
    ${avatarPicker('avatar', cleanAvatar(me.avatar))}
    <button>Simpan profil</button></form>`;
  wirePickers(card);
  onSubmit($('#pfForm'), async d => {
    await rpc('update_profile', { p_display_name: d.displayName, p_avatar: d.avatar });
    await fetchPlayers(); updateHeader(); closeProfile(); toast('Profil disimpan.'); render();
  });
}
function buildHeader() {
  const nav = $('#nav');
  if (nav.dataset.built) return;
  nav.dataset.built = '1';
  nav.innerHTML = `<div class="shell"><div class="site-header">
    <div class="header-left"><button class="profile-btn" id="profileBtn" type="button" aria-haspopup="true" aria-expanded="false"
      aria-controls="profileCard" aria-label="Buka kartu profil"></button><div class="profile-card" id="profileCard" hidden></div></div>
    <div class="header-right"><span class="conn connecting" id="conn" role="status">Menyambung</span>
    <button class="install-btn" id="installBtn" type="button" aria-label="Unduh app">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span class="lbl">Unduh app</span></button></div></div></div>`;
  $('#profileBtn').onclick = e => {
    e.stopPropagation();
    const open = $('#profileCard').hidden;
    if (open) { renderProfileCard(); $('#profileCard').hidden = false; } else $('#profileCard').hidden = true;
    $('#profileBtn').setAttribute('aria-expanded', String(open));
  };
  $('#installBtn').onclick = installApp;
  document.addEventListener('click', e => { if (!e.target.closest('.header-left')) closeProfile(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeProfile(); });
  updateInstallVisibility();
  paintConn();
}
function paintConn() {
  const el = $('#conn');
  if (!el) return;
  el.className = `conn ${connState}`;
  el.textContent = { ok: 'Online', bad: 'Offline', connecting: 'Menyambung' }[connState];
}
// "Champion" = pemain dengan kemenangan terbanyak (tidak ada bila seri).
function isChampion() {
  const mine = homeStats?.players?.[boot.me]?.wins ?? 0;
  return mine > 0 && boot.players.every(p => p.id === boot.me || mine > (homeStats.players[p.id]?.wins ?? 0));
}
function updateHeader() {
  const me = player(boot.me);
  if (!me) return;
  $('#profileBtn').innerHTML = `${avatar(me.avatar)}<span class="profile-text"><b>${esc(me.display_name)}</b><small>${isChampion() ? `${icon('crown')}Champion` : 'Dice Chess'}</small></span>`;
}

// ---- rendering ----
let renderId = 0;
async function render(showLoading = false) {
  if (!boot.me) return;
  const id = ++renderId;
  const [route, arg] = location.hash.slice(1).split('/');
  const page = (route === 'match' || route === 'replay') && arg ? route : 'home';
  buildHeader(); updateHeader();
  if (page !== 'home') document.body.classList.remove('playing');
  if (showLoading) loading();
  try {
    const paint = await pages[page](arg);
    if (id !== renderId) return;                // a newer render superseded this one
    clearInterval(replayTimer);
    paint();
  } catch (e) {
    console.error('[render]', e);
    if (id === renderId) errorBox(e, () => render(true));
  }
}
// Indikator koneksi dihapus dari header; status tetap dilacak dan hanya muncul sebagai pesan saat berubah.
function setConn(state) {
  const was = connState;
  connState = state;
  paintConn();
  if (state === 'bad' && was !== 'bad') toast('Koneksi terputus. Mencoba menyambung lagi…');
  if (state === 'ok' && was === 'bad') toast('Tersambung kembali.');
}

// ---- synchronisation: Realtime is only a "something changed" hint; get_live_state() is the truth ----
let syncing = false, again = false;
function scheduleSync(delay = 120) { clearTimeout(syncTimer); syncTimer = setTimeout(sync, delay); }
async function sync() {
  if (!boot.me) return;
  if (syncing) { again = true; return; }
  syncing = true;
  try {
    do {
      again = false;
      const next = await rpc('get_live_state');
      // never let an older snapshot overwrite a newer one
      if (next && live && next.game.id === live.game.id && next.game.version < live.game.version) continue;
      const changed = JSON.stringify([live?.game.id, live?.game.version]) !== JSON.stringify([next?.game.id, next?.game.version]);
      live = next;
      if (changed) selected = null;
      const onHome = isHome();
      if (live?.game.status === 'active') watching = live.game.id;
      else if (watching && !live) {
        const finished = watching; watching = null;
        if (onHome) { location.hash = 'match/' + finished; continue; }
      }
      if (changed && onHome) paintSetup();
      if (changed && !onHome && live?.game.status === 'waiting' && live.game.created_by !== boot.me)
        toast('Ada ajakan bermain. Kembali ke halaman utama.');
    } while (again);
    if (connState !== 'ok' && channels.length) setConn('ok');
  } catch (e) { console.error('[sync]', e); setConn('bad'); toast(friendly(e)); }
  finally { syncing = false; }
}

function teardownRealtime() {
  clearInterval(pollTimer); clearTimeout(syncTimer);
  channels.forEach(c => sb.removeChannel(c)); channels = [];
}
function setupRealtime() {
  teardownRealtime();
  const games = sb.channel('dice-chess-games')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'game_sessions' }, () => scheduleSync(80))
    .subscribe(status => {
      if (status === 'SUBSCRIBED') { setConn('ok'); scheduleSync(0); }       // (re)connected: refetch authoritative state
      else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') setConn('bad');
    });
  const presence = sb.channel('dice-chess-presence', { config: { presence: { key: boot.me } } });
  presence.on('presence', { event: 'sync' }, () => {
    online = Object.keys(presence.presenceState());
    if (isHome() && !busy) paintSetup();
  }).subscribe(async status => { if (status === 'SUBSCRIBED') await presence.track({ at: Date.now() }); });
  channels = [games, presence];
  // Safety net if a realtime message is ever missed.
  pollTimer = setInterval(() => { if (!document.hidden) sync(); }, 15000);
}
window.addEventListener('online', () => { scheduleSync(0); });
window.addEventListener('offline', () => setConn('bad'));
document.addEventListener('visibilitychange', () => { if (!document.hidden && boot.me) scheduleSync(0); });
window.addEventListener('hashchange', () => {
  if (!boot.me) return;
  selected = null; $('#toast').textContent = ''; render(true); window.scrollTo(0, 0);
});

// ---- startup ----
function normalizeSupabaseUrl(raw) {
  let u;
  try { u = new URL(String(raw || '').trim()); }
  catch { throw new Error('SUPABASE_URL tidak valid. Isi dengan URL Project Supabase, contoh https://xxxx.supabase.co'); }
  if (u.protocol !== 'https:' && u.hostname !== 'localhost')
    throw new Error('SUPABASE_URL harus menggunakan HTTPS.');

  // URL project harus berupa root domain. Jika tanpa sengaja yang disalin
  // adalah ...supabase.co/rest/v1, Auth akan salah mengarah ke
  // /rest/v1/auth/v1/token (404). Bersihkan suffix API tersebut otomatis.
  u.pathname = u.pathname.replace(/\/(?:rest|auth|storage)\/v1(?:\/.*)?$/i, '');
  if (u.pathname && u.pathname !== '/')
    throw new Error('SUPABASE_URL harus URL utama project, bukan URL endpoint /rest/v1.');
  return u.origin;
}

async function start(route) {
  loading();
  try {
    if (!window.supabase) throw new Error('Library Supabase gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.');
    if (/YOUR-/.test(CONFIG.SUPABASE_URL + CONFIG.SUPABASE_KEY)) return configScreen();
    const projectUrl = normalizeSupabaseUrl(CONFIG.SUPABASE_URL);
    if (!CONFIG.SUPABASE_KEY || CONFIG.SUPABASE_KEY.startsWith('YOUR-'))
      throw new Error('SUPABASE_KEY belum diisi. Gunakan publishable key atau anon key, bukan service_role.');
    console.info('[Dice Chess] Supabase project:', projectUrl);
    sb ||= window.supabase.createClient(projectUrl, CONFIG.SUPABASE_KEY,
      { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
    const { data: { session }, error } = await sb.auth.getSession();
    if (error) throw error;
    if (!session) return loginScreen();
    const info = await rpc('get_session_info');
    if (!info.registered) return claimScreen(info);
    boot.me = session.user.id;
    await fetchPlayers();
    $('#nav').hidden = false;
    if (route) history.replaceState(null, '', '#' + route);
    live = await rpc('get_live_state');
    if (live?.game.status === 'active') watching = live.game.id;
    setupRealtime();
    await render(true);
  } catch (e) {
    console.error('[start]', e);
    errorBox(new Error(friendly(e)), () => start(route));
  }
}
start();
})();
</script>
